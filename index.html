ified carrier details through the approved company channel. I don't want to give you an unverified number.","alternatives":["Let me check the carrier record and send the confirmed MC information securely."],"coaching":"Practice verification without inventing real authority numbers.","goals":[["verified","confirmed","check"],["carrier","MC"],["send"]],"facts":[],"term":"MC number: an identifier associated with motor carrier authority records.","difficulty":1,"chunks":["I'll send our verified carrier details through the approved company channel.","I don't want to give you an unverified number."],"easyAnswer":"I'll send our checked carrier details through the approved company channel. I don't want to give you an unverified number.","easyQuestion":""},{"id":"broker-011","role":"broker","category":"Load details","title":"Weight confirmation","context":"The fictional rate sheet lists 38,000 pounds of palletized paper.","question":"How much weight can you take on this one?","answer":"The posting says 38,000 pounds. Let me confirm the legal payload and axle distribution with the driver before I commit.","alternatives":["I see 38,000 pounds listed; I'll check the driver's payload and axle limits before accepting."],"coaching":"Total freight weight alone does not establish legal axle loading. Get the driver to verify the equipment.","goals":[["driver"],["confirm","check"],["payload","axle","legal"]],"facts":["38000"],"term":"Payload: the cargo weight carried by the equipment.","difficulty":1,"chunks":["The posting says 38,000 pounds.","Let me confirm the legal payload and axle distribution with the driver before I commit."],"easyAnswer":"The posting says 38,000 pounds. Let me check the legal payload and axle distribution with the driver before I commit.","easyQuestion":""},{"id":"broker-012","role":"broker","category":"Load details","title":"Live load or drop","context":"The listing does not identify whether the trailer will stay at the facility.","question":"Do you need anything else about the pickup?","answer":"Is this a live load or a drop-and-hook, and will our trailer be released the same day?","alternatives":["Could you clarify live loading versus dropping the trailer, and when we get our trailer back?"],"coaching":"A trailer commitment can affect the next load. Ask before promising it.","goals":[["live"],["drop"],["trailer","released","back"]],"facts":[],"term":"Drop-and-hook: dropping one trailer and picking up another.","difficulty":1,"chunks":["Is this a live load or a drop-and-hook, and will our trailer be released the same day?"],"easyAnswer":"Is this a live load or a drop-and-hook, and will our trailer be released the same day?","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-013","role":"broker","category":"Load details","title":"Appointment time zone","context":"Pickup is Monday at 9 AM Eastern, not in Kandahar time.","question":"Can your driver make the nine o'clock pickup?","answer":"Let me confirm: Monday at 9 AM Eastern. I'll verify the driver's arrival plan before committing.","alternatives":["You mean 9 AM Eastern on Monday, correct? I'll confirm the driver's ETA first."],"coaching":"Repeat the day, AM or PM, and facility time zone before accepting an appointment.","goals":[["Monday"],["Eastern"],["verify","confirm"],["driver","ETA"]],"facts":["9am"],"term":"Facility time: the local time zone of the shipper or receiver.","difficulty":2,"chunks":["Let me confirm: Monday at 9 AM Eastern.","I'll verify the driver's arrival plan before committing."],"easyAnswer":"Let me check: Monday at 9 AM Eastern. I'll check the driver's arrival plan before promising.","easyQuestion":""},{"id":"broker-014","role":"broker","category":"Load details","title":"FCFS receiving","context":"The receiver says FCFS from 7 AM to 2 PM, not a guaranteed unloading slot.","question":"Delivery is first come, first served. Are we good?","answer":"Please confirm the receiving window and check-in cutoff. I understand FCFS does not guarantee immediate unloading.","alternatives":["What are the FCFS hours and final check-in time? We'll allow for a possible queue."],"coaching":"Distinguish the facility's receiving window from a scheduled dock slot.","goals":[["window","hours"],["cutoff","check in"],["queue","wait","does not guarantee"]],"facts":[],"term":"FCFS: first come, first served.","difficulty":2,"chunks":["Please confirm the receiving window and check-in cutoff.","I understand FCFS does not guarantee immediate unloading."],"easyAnswer":"Please check the receiving window and check-in cutoff. I understand FCFS doesn't guarantee immediate unloading.","easyQuestion":""},{"id":"broker-015","role":"broker","category":"Load details","title":"Sealed trailer","context":"The broker requires a seal after loading.","question":"Can your driver break the seal if the receiver asks?","answer":"The driver should follow the documented seal procedure and obtain authorized instructions before breaking the seal.","alternatives":["We'll verify the receiver's authority and follow the written seal instructions before opening it."],"coaching":"Record seal changes and instructions rather than silently replacing a seal.","goals":[["seal"],["authorized","authority"],["instructions","procedure"]],"facts":[],"term":"Seal: a numbered device used to show whether a trailer was opened.","difficulty":2,"chunks":["The driver should follow the documented seal procedure and obtain authorized instructions before breaking the seal."],"easyAnswer":"The driver should follow the written down seal procedure and get authorized instructions before breaking the seal.","easyQuestion":""},{"id":"broker-016","role":"broker","category":"Load details","title":"Special equipment","context":"The shipper requires load bars and straps for this palletized shipment.","question":"Does your driver have the required securement gear?","answer":"I'll confirm the load bars and straps with the driver, including the quantities required by the shipper.","alternatives":["Let me verify the driver's bars and straps against the shipper's requirements."],"coaching":"Do not answer yes just because the truck is a Dry Van. Verify actual equipment.","goals":[["driver"],["bars"],["straps"],["confirm","verify"]],"facts":[],"term":"Securement: methods and equipment used to restrain cargo.","difficulty":2,"chunks":["I'll confirm the load bars and straps with the driver, including the quantities required by the shipper."],"easyAnswer":"I'll check the load bars and straps with the driver, including the quantities needed by the shipper.","easyQuestion":""},{"id":"broker-017","role":"broker","category":"Load details","title":"Driver hours","context":"You do not yet have verified remaining driver hours.","question":"Can you guarantee next-morning delivery?","answer":"I need to verify the driver's available hours, route, and appointment before I can confirm that delivery.","alternatives":["Let me check the driver's hours and trip plan first; I can't promise an unverified arrival."],"coaching":"An attractive rate does not make an impossible delivery feasible.","goals":[["hours"],["driver"],["verify","check"],["route","plan"]],"facts":[],"term":"Available hours: driving and duty time remaining under applicable rules.","difficulty":2,"chunks":["I need to verify the driver's available hours, route, and appointment before I can confirm that delivery."],"easyAnswer":"I need to check the driver's available hours, route, and appointment before I can check that delivery.","easyQuestion":""},{"id":"broker-018","role":"broker","category":"Load details","title":"Trailer condition","context":"Food-grade packaging requires a clean, dry, odor-free trailer.","question":"Is your trailer food-grade?","answer":"I'll ask the driver to inspect the trailer for cleanliness, moisture, odors, and damage before confirming suitability.","alternatives":["Let me verify that the racking invitation.","question":"Why isn't your driver on tracking yet?","answer":"I'll confirm the invitation reached the driver and help resolve access. I'll send verified updates while we work on it.","alternatives":["Let me check the driver's tracking link; I'll keep you updated using confirmed check calls meanwhile."],"coaching":"Do not say tracking is active before the driver and system confirm it.","goals":[["driver"],["invitation","link"],["verify","confirmed","update"]],"facts":[],"term":"Tracking invitation: a request for the driver's location-sharing setup.","difficulty":2,"chunks":["I'll confirm the invitation reached the driver and help resolve access.","I'll send verified updates while we work on it."],"easyAnswer":"I'll check the invitation reached the driver and help resolve access. I'll send checked updates while we work on it.","easyQuestion":""},{"id":"broker-021","role":"broker","category":"Negotiation","title":"Make a counteroffer","context":"The fictional offer is $2,200; your approved request is $2,500 all-in.","question":"I'm at twenty-two hundred. What do you need?","answer":"Could you do $2,500 all-in? That would help cover the deadhead and the appointment requirements.","alternatives":["We would need $2,500 all-in based on the empty miles and this schedule."],"coaching":"State a specific request and business reason. Do not claim these fictional figures are market rates.","goals":[["all in"],["deadhead","empty"],["appointment","schedule"]],"facts":["2500"],"term":"All-in: the agreed total for the stated transportation work.","difficulty":2,"chunks":["Could you do $2,500 all-in?","That would help cover the deadhead and the appointment requirements."],"easyAnswer":"Could you do $2,500 all-in? That would help cover the deadhead and the appointment requirements.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-022","role":"broker","category":"Negotiation","title":"Ask for the best rate","context":"You have not yet received the broker's offer.","question":"What's your rate?","answer":"What is your best all-in offer, including the stated stops and requirements?","alternatives":["Could you share your best total rate for the full trip as listed?"],"coaching":"Clarify scope so that the quoted figure means the same thing to both sides.","goals":[["best","offer"],["all in","total"],["stop","requirement","trip"]],"facts":[],"term":"Offer: a proposed amount that has not yet been accepted.","difficulty":2,"chunks":["What is your best all-in offer, including the stated stops and requirements?"],"easyAnswer":"What is your best all-in offer, including the stated stops and requirements?","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-023","role":"broker","category":"Negotiation","title":"Respect the broker's budget","context":"The broker says there is little flexibility; you can still ask professionally.","question":"That's all the customer gave me. Can you help?","answer":"I understand the budget. Is there any flexibility to help with the deadhead, or can the pickup window be adjusted?","alternatives":["I hear you. Could you improve the rate for the empty miles or give us more pickup flexibility?"],"coaching":"Acknowledge the constraint and explore a practical adjustment without pressure or insults.","goals":[["understand","hear"],["deadhead","empty"],["flexibility","adjust","improve"]],"facts":[],"term":"Flexibility: room to change a rate or operating requirement.","difficulty":2,"chunks":["I understand the budget.","Is there any flexibility to help with the deadhead, or can the pickup window be adjusted?"],"easyAnswer":"I understand the budget. Is there any flexibility to help with the deadhead, or can the pickup window be adjusted?","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-024","role":"broker","category":"Negotiation","title":"Decline an unsuitable load","context":"The price and appointment do not fit your approved plan.","question":"Are you taking it or not?","answer":"Thank you for checking. We can't make this work with the current rate and appointment. Please keep us in mind for another load.","alternatives":["I'll pass on this one at these terms, but I'd be glad to review another load that fits."],"coaching":"Decline clearly and preserve the relationship. Avoid saying booked when you mean interested.","goals":[["pass","can't","cannot"],["rate","terms","appointment"],["another","keep"]],"facts":[],"term":"Pass: politely decline an opportunity.","difficulty":2,"chunks":["Thank you for checking.","We can't make this work with the current rate and appointment.","Please keep us in mind for another load."],"easyAnswer":"Thank you for checking. We can't make this work with the current rate and appointment. Please keep us in mind for another load.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-025","role":"broker","category":"Negotiation","title":"Distinguish interest from booking","context":"You are checking the plan but have not accepted the load.","question":"So we're booked, right?","answer":"Not yet. We're interested, but I still need to confirm the driver and review the rate confirmation.","alternatives":["We're not committed yet; I need driver confirmation and the written load terms first."],"coaching":"Interest is not a completed booking. Make the current commitment status explicit.","goals":[["not yet","not committed"],["driver"],["rate confirmation","written"]],"facts":[],"term":"Commitment: a clear agreement to perform the load.","difficulty":2,"chunks":["Not yet.","We're interested, but I still need to confirm the driver and review the rate confirmation."],"easyAnswer":"Not yet. We're interested, but I still need to check the driver and review the rate written confirmation.","easyQuestion":""},{"id":"broker-026","role":"broker","category":"Negotiation","title":"Confirm agreed rate","context":"You negotiated a fictional total of $2,500 all-in.","question":"We can do twenty-five hundred. Can you confirm?","answer":"Confirming $2,500 all-in for the stated pickup, delivery, and requirements. Please send the rate confirmation for review.","alternatives":["Yes, the agreed total is $2,500 all-in on the terms discussed. Please email the confirmation."],"coaching":"Read the agreed amount back before checking the written document.","goals":[["all in"],["rate confirmation","confirmation"],["pickup","terms"]],"facts":["2500"],"term":"Rate confirmation: the written rate and load terms.","difficulty":2,"chunks":["Confirming $2,500 all-in for the stated pickup, delivery, and requirements.","Please send the rate confirmation for review."],"easyAnswer":"Confirming $2,500 all-in for the stated pickup, delivery, and requirements. Please send the rate written confirmation for review.","easyQuestion":""},{"id":"broker-027","role":"broker","category":"Negotiation","title":"Rushed decision","context":"A broker wants an instant answer before you have checked driver availability.","question":"I need a yes right now. Can your truck do it?","answer":"I can give you an accurate answer after I confirm the driver. If you can't hold it briefly, I understand.","alternatives":["Let me verify the driver's availability first; I don't want to commit a truck I can't cover."],"coaching":"Stay calm. An honest short check is better communication than an unsupported promise.","goals":[["driver"],["confirm","verify"],["availability","available","cover"]],"facts":[],"term":"Cover: arrange a truck to move the load.","difficulty":2,"chunks":["I can give you an accurate answer after I confirm the driver.","If you can't hold it briefly, I understand."],"easyAnswer":"I can give you an accurate answer after I check the driver. If you can't hold it briefly, I understand.","easyQuestion":""},{"id":"broker-028","role":"broker","category":"Negotiation","title":"Separate accessorials","context":"The quoted total may not include waiting or a receiver's unloading service.","question":"Isn't everything included in your rate?","answer":"The all-in rate covers the stated transportation. Please confirm the separate written terms for detention, layover, and any approved lumper charge.","alternatives":["Let's confirm which accessorials are included and which need separate approval in writing."],"coaching":"Do not assume an all-in rate answers every exception or reimbursement question.","goals":[["included","covers"],["accessorial","detention","layover"],["written","writing"]],"facts":[],"term":"Accessorial: an additional service charge subject to agreed terms.","difficulty":2,"chunks":["The all-in rate covers the stated transportation.","Please confirm the separate written terms for detention, layover, and any approved lumper charge."],"easyAnswer":"The all-in rate covers the stated transportation. Please check the separate written terms for detention, layover, and any approved lumper charge.","easyQuestion":""},{"id":"broker-029","role":"broker","category":"Negotiation","title":"Hold request","context":"You need a moment to check your notes while remaining on the call.","question":"Can you give me your answer now?","answer":"May I place you on a brief hold while I confirm the driver and appointment?","alternatives":["Could you give me a moment to check the driver and schedule, please?"],"coaching":"Ask permission, name the reason, and return with a clear result.","goals":[["hold","moment"],["driver"],["appointment","schedule"]],"facts":[],"term":"Brief hold: a short pause in the telephone conversation.","difficulty":3,"chunks":["May I place you on a brief hold while I confirm the driver and appointment?"],"easyAnswer":"May I place you on a brief hold while I check the driver and appointment?","easyQuestion":""},{"id":"broker-030","role":"broker","category":"Negotiation","title":"Relationship without overpromising","context":"A broker asks if your team can cover this lane every week.","question":"Can you handle this lane every Friday?","answer":"We'd like to build the lane. Let's review each week's equipment and schedule before confirming regular capacity.","alternatives":["We're interested in repeat business; we'll confirm available trucks and timing for each week."],"coaching":"Show interest while keeping future capacity conditional on the actual plan.","goals":[["week","regular","repeat"],["truck","equipment","capacity"],["schedule","timing","confirm"]],"facts":[],"term":"Regular capacity: recurring availability for a lane.","difficulty":3,"chunks":["We'd like to build the lane.","Let's review each week's equipment and schedule before confirming regular capacity."],"easyAnswer":"We'd like to build the lane. Let's review each week's truck or trailer and schedule before confirming regular capacity.","easyQuestion":""},{"id":"broker-031","role":"broker","category":"Documents","title":"Wrong rate on confirmation","context":"You agreed $2,500 but the fictional rate confirmation shows $2,300.","question":"Can you sign the confirmation I just sent?","answer":"It shows $2,300, but we agreed $2,500. Please send an amended confirmation before I sign.","alternatives":["Please correct the rate from $2,300 to the agreed $2,500; I'll review the amendment before signing."],"coaching":"Spot the discrepancy and request the corrected document. Do not sign a known wrong rate.","goals":[["amended","amendment","correct"],["before"],["sign"]],"facts":["2300","2500"],"term":"Amended confirmation: a revised document reflecting corrected terms.","difficulty":3,"chunks":["It shows $2,300, but we agreed $2,500.","Please send an amended confirmation before I sign."],"easyAnswer":"It shows $2,300, but we agreed $2,500. Please send an amended written confirmation before I sign.","easyQuestion":""},{"id":"broker-032","role":"broker","category":"Documents","title":"Wrong delivery time","context":"The call agreed Tuesday at 10 AM Central; the document says 10 PM.","question":"Everything else looks right, can we leave the time?","answer":"We agreed Tuesday at 10 AM Central. Please correct the delivery time in writing before we accept.","alternatives":["The appointment needs to read Tuesday, 10 AM Central, not the evening time. Please send the correction."],"coaching":"AM and PM are material operational facts even when the clock number is identical.","goals":[["Tuesday"],["Central"],["correct","writing"]],"facts":["10am"],"term":"Appointment discrepancy: a conflict between agreed and written timing.","difficulty":3,"chunks":["We agreed Tuesday at 10 AM Central.","Please correct the delivery time in writing before we accept."],"easyAnswer":"We agreed Tuesday at 10 AM Central. Please correct the delivery time in writing before we accept.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-033","role":"broker","category":"Documents","title":"Missing pickup number","context":"The driver cannot check in without the shipper's pickup reference.","question":"Why hasn't the truck checked in?","answer":"We're missing the pickup number required for check-in. Could you send it and confirm it matches this load?","alternatives":["The shipper needs the pickup reference before check-in. Please send the correct number for this shipment."],"coaching":"Ask for the missing identifier without inventing one.","goals":[["pickup"],["number","reference"],["check in"]],"facts":[],"term":"Pickup number: the shipment reference used by the shipping facility.","difficulty":3,"chunks":["We're missing the pickup number required for check-in.","Could you send it and confirm it matches this load?"]," ed and record any authorized correction.","goals":[["seal"],["match","mismatch"],["document","photograph"],["authorized","written"]],"facts":[],"term":"Seal discrepancy: a conflict between recorded and observed seal information.","difficulty":3,"chunks":["The seal numbers don't match.","We'll document both and request authorized instructions before changing anything."],"easyAnswer":"The seal numbers don't match. We'll document both and request authorized instructions before changing anything.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-038","role":"broker","category":"Documents","title":"Written route change","context":"The broker verbally changes the receiver after pickup.","question":"Please tell your driver to go to the new address.","answer":"Please send the new address and appointment in writing. We'll verify feasibility and any added miles or charges before confirming.","alternatives":["I need written revised delivery instructions, timing, and compensation for any extra work before accepting the change."],"coaching":"Treat a changed destination as a change to the work and documents.","goals":[["written","writing"],["address","delivery"],["appointment","timing"],["mile","charge","compensation"]],"facts":[],"term":"Reconsignment: changing the delivery destination or consignee.","difficulty":3,"chunks":["Please send the new address and appointment in writing.","We'll verify feasibility and any added miles or charges before confirming."],"easyAnswer":"Please send the new address and appointment in writing. We'll check feasibility and any added miles or charges before confirming.","easyQuestion":""},{"id":"broker-039","role":"broker","category":"Documents","title":"Invoice dispute","context":"A broker says an approved unloading reimbursement is missing its receipt.","question":"Why is this charge on your invoice?","answer":"It's the approved unloading charge. I'll attach the authorization, receipt, and matching load documents for review.","alternatives":["I'll send the approval and lumper receipt linked to this load so you can verify the invoice item."],"coaching":"Tie every disputed charge to the agreed terms and evidence rather than repeating the total.","goals":[["approval","authorization","approved"],["receipt"],["load"]],"facts":[],"term":"Supporting document: evidence used to validate a billing item.","difficulty":3,"chunks":["It's the approved unloading charge.","I'll attach the authorization, receipt, and matching load documents for review."],"easyAnswer":"It's the approved unloading charge. I'll attach the authorization, receipt, and matching load documents for review.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-040","role":"broker","category":"Documents","title":"Carrier packet request","context":"The broker needs onboarding information through a verified channel.","question":"Can you send me your packet?","answer":"Yes, I'll send the current carrier packet to your verified company address and confirm receipt.","alternatives":["I'll use the verified company email for our updated carrier documents; please confirm when they arrive."],"coaching":"Use current documents and the verified recipient. A random new address is not verification.","goals":[["carrier"],["packet","documents"],["verified"],["confirm","receipt"]],"facts":[],"term":"Onboarding: reviewing information before working with a carrier.","difficulty":3,"chunks":["Yes, I'll send the current carrier packet to your verified company address and confirm receipt."],"easyAnswer":"Yes, I'll send the current carrier packet to your checked company address and check receipt.","easyQuestion":""},{"id":"broker-041","role":"broker","category":"Exceptions","title":"Late arrival warning","context":"The driver's verified ETA is 11 AM Eastern against a or waiting is automatic, right?","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-043","role":"broker","category":"Exceptions","title":"Detention calculation","context":"Training terms allow 2 free hours, then $50 an hour; verified eligible waiting totals 5 hours.","question":"What detention are you requesting under these terms?","answer":"Five hours minus two free hours leaves three billable hours. At $50 per hour, we're requesting $150 with the timestamps attached.","alternatives":["Under this agreement it's three payable hours at $50, totaling $150; I'll attach the time evidence."],"coaching":"Show the calculation and evidence. These are scenario terms, not an industry-wide entitlement.","goals":[["hour"],["timestamp","evidence","time"]],"facts":["3","50","150"],"term":"Free time: agreed waiting time before billable detention begins.","difficulty":3,"chunks":["Five hours minus two free hours leaves three billable hours.","At $50 per hour, we're requesting $150 with the timestamps attached."],"easyAnswer":"Five hours minus two free hours leaves three billable hours. At $50 per hour, we're requesting $150 with the timestamps attached.","easyQuestion":"What payment for waiting are you requesting under these terms?","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"broker-044","role":"broker","category":"Exceptions","title":"TONU request","context":"The broker cancels after dispatch; no fee has yet been authorized.","question":"Are you asking for truck ordered not used?","answer":"Yes, please review TONU under our agreed terms. I'll provide the dispatch and cancellation timeline and request written approval.","alternatives":["I'd like to submit a documented TONU request with the cancellation evidence for approval."],"coaching":"A request is not an approved charge. Establish the agreement and evidence ke it?","answer":"We expect to miss the current appointment. The verified ETA is 11 AM Eastern; can you help us secure a revised slot?","alternatives":["The short answer is no for the current time; our updated ETA is 11 AM Eastern. Please request a new appointment."],"coaching":"Lead with the answer, then the key fact and action. Do not become defensive.","goals":[["Eastern"],["revised","new"],["appointment","slot"]],"facts":["11am"],"term":"Revised slot: a replacement appointment arranged with the facility.","difficulty":3,"chunks":["We expect to miss the current appointment.","The verified ETA is 11 AM Eastern; can you help us secure a revised slot?"],"easyAnswer":"We expect to miss the current appointment. The checked ETA is 11 AM Eastern. can you help us secure a updated slot?","easyQuestion":""},{"id":"broker-049","role":"broker","category":"Exceptions","title":"Close the call clearly","context":"The rate and appointments are agreed, pending written document review.","question":"Anything else before we hang up?","answer":"Please send the rate confirmation. I'll review it, confirm the driver, and call back if any detail differs. Thank you for your help.","alternatives":["Send the written terms, please. I'll verify everything with the driver and follow up on any mismatch. Thanks."],"coaching":"End with responsibilities and next action so both people know what happens next.","goals":[["confirmation","written"],["driver"],["review","verify","check"],["thank"]],"facts":[],"term":"Follow-up: the next action after the conversation.","difficulty":3,"chunks":["Please send the rate confirmation.","I'll review it, confirm the driver, and call back if any detail differs.","Thank you for your help."],"easyAnswer":"Please send the rate written confirmation. I'll review it, check the driver, and call back if any detail differs. Thank you for your help.","easyQuestion":""},{"id":"dispatcher-001","role":"dispatcher","category":"Broker practice","title":"Respond to a truck inquiry","context":"The app is Pamir dispatch; you are the fictional broker offering a Columbus to Atlanta load.","question":"Do you still have the Columbus to Atlanta load?","answer":"Yes, it's available. It's palletized paper for a 53-foot dry van. Let me walk you through the pickup and delivery details.","alternatives":["Yes, the Atlanta load is open; it's paper in a 53-foot van. I'll confirm the schedule and requirements with you."],"coaching":"You are the broker in this role. Give clear load information rather than answering as the carrier.","goals":[["available","open"],["paper"],["van"],["schedule","pickup"]],"facts":["53"],"term":"Role reversal: practicing the other side of the business call.","difficulty":1,"chunks":["Yes, it's available.","It's palletized paper for a 53-foot dry van.","Let me walk you through the pickup and delivery details."],"easyAnswer":"Yes, it's available. It's palletized paper for a 53-foot dry van. Let me walk you through the pickup and delivery details.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"dispatcher-002","role":"dispatcher","category":"Broker practice","title":"Give pickup details","context":"The fictional load picks up Monday at 9 AM Eastern in Columbus.","question":"What is the pickup appointment?","answer":"Pickup is Monday at 9 AM Eastern in Columbus. I'll include the full facility address and reference on the confirmation.","alternatives":["The Columbus appointment is Monday, 9 AM Eastern; the written confirmation will have the exact address and pickup number."],"coaching":"State the facility time zone and include the written reference information.","goals":[["Monday"],["Eastern"],["Columbus"],["confirmation"]],"facts":["9am"],"term":"Pickup appointment: the booked loading time.","difficulty":1,"chunks":["Pickup is Monday at 9 AM Eastern in Columbus.","I'll include the full facility address and reference on the confirma cher","category":"Broker practice","title":"Explain your opening offer","context":"Your fictional opening budget is $2,200 all-in.","question":"What are you paying on it?","answer":"We're offering $2,200 all-in for the stated pickup and delivery. Accessorial terms will be on the confirmation.","alternatives":["The total transportation offer is $2,200; I'll put the load scope and additional-charge terms in writing."],"coaching":"An opening offer is not a claim about the live freight market.","goals":[["offer","total"],["terms","writing","confirmation"]],"facts":["2200"],"term":"Budget: the available amount for this fictional negotiation.","difficulty":1,"chunks":["We're offering $2,200 all-in for the stated pickup and delivery.","Accessorial terms will be on the confirmation."],"easyAnswer":"We're offering $2,200 all-in for the stated pickup and delivery. Accessorial terms will be on the written confirmation.","easyQuestion":""},{"id":"dispatcher-006","role":"dispatcher","category":"Broker practice","title":"Respond to a counter","context":"The dispatcher requests $2,500; your authorized ceiling has not been checked.","question":"Can you come up to twenty-five hundred?","answer":"Let me check whether $2,500 can be approved. I don't want to promise a rate outside my authority.","alternatives":["I'll request approval for $2,500 and get back to you before confirming."],"coaching":"Do not invent an approval just to keep a carrier on the line.","goals":[["approval","approved"],["check","request"]],"facts":["2500"],"term":"Approval limit: the amount a person is authorized to agree.","difficulty":1,"chunks":["Let me check whether $2,500 can be approved.","I don't want to promise a rate outside my authority."],"easyAnswer":"Let me check whether $2,500 can be approved. I don't want to promise a rate outside my authority.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"dispatc e that isn't in the agreement.","easyQuestion":"Are you paying payment for waiting after two hours?"},{"id":"dispatcher-009","role":"dispatcher","category":"Broker practice","title":"Correct your confirmation","context":"You accidentally issued $2,300 after agreeing $2,500.","question":"Your confirmation has the wrong rate. Can you fix it?","answer":"You're right; we agreed $2,500. I'll send an amended confirmation and ask you to review the corrected rate before signing.","alternatives":["I'll correct it to $2,500 and send the revised document for your review."],"coaching":"Acknowledge the specific error and correct the authoritative document.","goals":[["correct","amended","revised"],["confirmation","document"],["review"]],"facts":["2500"],"term":"Amendment: a documented change to an agreement.","difficulty":1,"chunks":["You're right; we agreed $2,500.","I'll send an amended confirmation and ask you to review the corrected rate before signing."],"easyAnswer":"You're right. we agreed $2,500. I'll send an amended written confirmation and ask you to review the corrected rate before signing.","easyQuestion":""},{"id":"dispatcher-010","role":"dispatcher","category":"Broker practice","title":"Missing pickup number","context":"The shipper has not yet supplied its release reference.","question":"Can you send the pickup number now?","answer":"I'm requesting it from the shipper. I'll send the verified reference as soon as I have it; I won't guess.","alternatives":["The reference is still pending from the shipper. I'll confirm and forward it rather than give you an unverified number."],"coaching":"A useful status identifies the owner and next action even before the answer is available.","goals":[["shipper"],["reference","number"],["send","forward"],["pending","request"]],"facts":[],"term":"Pending: waiting for a required item or action.","difficulty":1,"chunks":["I'm requesting it from the shipper.","I'll send the verified reference as soon as I have it; I won't guess."],"easyAnswer":"I'm requesting it from the shipper. I'll send the checked reference as soon as I have it. I won't guess.","easyQuestion":""},{"id":"dispatcher-011","role":"dispatcher","category":"Broker practice","title":"Provide load bars requirement","context":"The fictional shipper requires 4 load bars.","question":"What securement does the shipper require?","answer":"This shipment requires 4 load bars. Please confirm your driver has them before we commit the truck.","alternatives":["The shipper asks for 4 bars; have the driver verify they're on the trailer before booking."],"coaching":"Treat an equipment count as a required operating fact.","goals":[["bars"],["driver"],["confirm","verify"]],"facts":["4"],"term":"Load bar: adjustable equipment used to help restrain freight.","difficulty":1,"chunks":["This shipment requires 4 load bars.","Please confirm your driver has them before we commit the truck."],"easyAnswer":"This load requires 4 load bars. Please check your driver has them before we commit the truck.","easyQuestion":""},{"id":"dispatcher-012","role":"dispatcher","category":"Broker practice","title":"Receiver time change","context":"The receiver changes delivery to Wednesday at 8 AM Central.","question":"Is the original delivery appointment still good?","answer":"It has changed to Wednesday at 8 AM Central. I'll send revised written instructions and review the impact on your trip.","alternatives":["The new appointment is Wednesday, 8 AM Central. Let's document the change and discuss any extra work."],"coaching":"Do not leave the old time in writing after agreeing a change.","goals":[["Wednesday"],["Central"],["written","revised","document"]],"facts":["8am"],"term":"Revised instructions: updated directions that replace earlier instructions.","difficulty":1,"chunks":["It has changed to Wednesday at 8 AM Central.","I'll send revised written instructions and review the impact on your trip."],"easyAnswer":"It has changed to Wednesday at 8 AM Central. I'll send updated written instructions and review the impact on your trip.","easyQuestion":""},{"id":"dispatcher-013","role":"dispatcher","category":"Broker practice","title":"Request early delay notice","context":"The carrier reports a delay only after missing pickup.","question":"When do you need updates if our ETA changes?","answer":"Please notify me as soon as the appointment is at risk, with the verified ETA and the next planned update.","alternatives":["Give me early notice, the best supported arrival estimate, and when you'll check back."],"coaching":"Ask for actionable information, not impossible guarantees.","goals":[["early","as soon"],["ETA","arrival"],["update","check back"]],"facts":[],"term":"At risk: likely to be missed unless the plan changes.","difficulty":2,"chunks":["Please notify me as soon as the appointment is at risk, with the verified ETA and the next planned update."],"easyAnswer":"Please tell me as soon as the appointment is at risk, with the checked ETA and the next planned update.","easyQuestion":"When do you need updates if our arrival time changes?"},{"id":"dispatcher-014","role":"dispatcher","category":"Broker practice","title":"Listen to a breakdown report","context":"The dispatcher says a repair time is not yet known.","question":"Can you reschedule delivery while we get the truck assessed?","answer":"Yes, I'll contact the receiver with the confirmed breakdown facts and request a revised appointment. Please update me after the assessment.","alternatives":["I'll work on a new delivery slot; send the repair assessment when available so we can update the plan."],"coaching":"Coordinate from verified facts. A lack of ETA should not become a fabricated promise.","goals":[["receiver"],["revised","new"],["appointment","slot"],["assessment","update"]],"facts":[],"term":"Assessment: a professional check of the problem and likely next step.","difficulty":2,"chunks":["Yes, I'll contact the receiver with the confirmed breakdown facts and request a revised appoin rms.","goals":[["invoice"],["POD","delivery document"],["receipt"],["load"]],"facts":[],"term":"Invoice: a request for payment for the documented work.","difficulty":2,"chunks":["Please send the invoice, signed delivery document, and any authorized accessorial receipts matching this load."],"easyAnswer":"Please send the invoice, signed delivery document, and any authorized accessorial receipts matching this load.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"dispatcher-019","role":"dispatcher","category":"Broker practice","title":"Don't claim a truck is tracked","context":"The carrier says tracking is set up, but no location is visible.","question":"Do you see our driver on tracking?","answer":"Not yet. I don't have a verified location in the system. Please check the driver's invitation and send a confirmed update meanwhile.","alternatives":["Tracking hasn't shown a confirmed position; let's troubleshoot the link and use a verified check call for now."],"coaching":"Distinguish a sent link from active, verified tracking.","goals":[["not yet","hasn't"],["tracking"],["confirmed","verified"],["update","check call"]],"facts":[],"term":"Check call: a direct status update from the driver or carrier.","difficulty":2,"chunks":["Not yet.","I don't have a verified location in the system.","Please check the driver's invitation and send a confirmed update meanwhile."],"easyAnswer":"Not yet. I don't have a checked location in the system. Please check the driver's invitation and send a confirmed update meanwhile.","easyQuestion":""},{"id":"dispatcher-020","role":"dispatcher","category":"Broker practice","title":"Close a booking","context":"The fictional rate and appointments have been agreed; documents still need review.","question":"Are we all set?","answer":"I'll send the confirmation with the agreed rate, appointments, and requirements. Please review it and confirm the assigned driver before dispatch.","alternatives":["The written load terms are next; verify the details and driver assignment, then confirm back."],"coaching":"A proper close includes what is agreed and what still requires action.","goals":[["confirmation","written"],["rate"],["appointment"],["driver"]],"facts":[],"term":"Assigned driver: the driver selected and confirmed for the shipment.","difficulty":2,"chunks":["I'll send the confirmation with the agreed rate, appointments, and requirements.","Please review it and confirm the assigned driver before dispatch."],"easyAnswer":"I'll send the written confirmation with the agreed rate, appointments, and requirements. Please review it and check the assigned driver before dispatch.","easyQuestion":""},{"id":"dispatcher-021","role":"dispatcher","category":"Clarification","title":"Explain all-in","context":"The dispatcher asks whether the quoted offer includes fuel for the defined route.","question":"Is that linehaul plus fuel or all-in?","answer":"It's an all-in transportation offer for the defined route. I'll list the agreed total and separate accessorial terms in writing.","alternatives":["That figure is the total transportation rate; the confirmation will explain additional-charge terms separately."],"coaching":"Answer the price-structure question directly and document it.","goals":[["all in","total"],["route","transportation"],["writing","confirmation"]],"facts":[],"term":"Linehaul: the basic transportation charge before separately stated additions.","difficulty":2,"chunks":["It's an all-in transportation offer for the defined route.","I'll list the agreed total and separate accessorial terms in writing."],"easyAnswer":"It's an all-in transportation offer for the defined route. I'll list the agreed total and separate accessorial terms in writing.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"dispatcher-022","role":"dispatcher","category":"Clarification","title":"Limit a hold honestly","context":"Another carrier is asking about the same load.","question":"Can you hold it for me while I check with the driver?","answer":"I can hold it briefly while you verify the driver, but please confirm promptly. It isn't booked until we agree the terms.","alternatives":["Take a short moment to check; I need a clear confirmation before treating this as covered."],"coaching":"Set a clear expectation without implying two trucks are booked for the same freight.","goals":[["driver","check"],["confirm"],["booked","covered","agree"]],"facts":[],"term":"Hold: a temporary pause while a potential booking is checked.","difficulty":2,"chunks":["I can hold it briefly while you verify the driver, but please confirm promptly.","It isn't booked until we agree the terms."],"easyAnswer":"I can hold it briefly while you check the driver, but please check promptly. It isn't booked until we agree the terms.","easyQuestion":""},{"id":"dispatcher-023","role":"dispatcher","category":"Clarification","title":"Clarify pallet exchange","context":"The shipper requires pallet exchange, omitted from the first listing.","question":"Does this load require pallet exchange?","answer":"Yes, pallet exchange is required. I'll send the quantities and procedure so you can verify your driver can meet it.","alternatives":["There is a pallet exchange requirement; let's review the count and instructions before booking."],"coaching":"Disclose a material requirement before commitment.","goals":[["pallet"],["exchange"],["quantity","quantities","count"],["procedure","instructions"]],"facts":[],"term":"Pallet exchange: replacing or returning pallets under agreed instructions.","difficulty":2,"chunks":["Yes, pallet exchange is required.","I'll send the quantities and procedure so you can verify your driver can meet it."],"easyAnswer":"Yes, pallet exchange is needed. I'll send the quantities and procedure so you can check your driver can meet it.","easyQuestion":""},{"id":"dispatcher-024","role":"dispatcher","category":"Clarification","title":"Refuse invented references","context":"The dispatcher asks for a delivery number you do not yet have.","question":"Can you just give me any number to check in?","answer":"I can't provide an invented reference. I'll get the correct delivery number from the receiver and send it to you.","alternatives":["Let me obtain the verified receiver reference; a made-up number could prevent check-in."],"coaching":"The need for speed does not make false information useful.","goals":[["correct","verified"],["receiver"],["reference","number"]],"facts":[],"term":"Delivery number: the reference required at the receiving facility.","difficulty":2,"chunks":["I can't provide an invented reference.","I'll get the correct delivery number from the receiver and send it to you."],"easyAnswer":"I can't give an invented reference. I'll get the correct delivery number from the receiver and send it to you.","easyQuestion":""},{"id":"dispatcher-025","role":"dispatcher","category":"Clarification","title":"Request factual claim evidence","context":"The carrier says several pallets were damaged at delivery.","question":"What do you need for the damage report?","answer":"Please send the signed exception notation, clear photos, count details, and the driver's factual account for review.","alternatives":["I need the documented damage, pictures, quantities, and what the driver actually observed."],"coaching":"Request evidence without asking anyone to remove or conceal damage notation.","goals":[["photo","picture"],["notation","document"],["count","quantity","quantities"],["driver"]],"facts":[],"term":"Exception notation: written detail recording a departure from expected condition.","difficulty":2,"chunks":["Please send the signed exception notation, clear photos, count details, and the driver's factual account for review."],"easyAnswer":"Please send the signed exception notation, clear photos, count details, and the driver's factual account for review.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"dispatcher-026","role":"dispatcher","category":"Clarification","title":"Respond to a rate threat","context":"The dispatcher threatens to walk away; you have no authorization to increase the rate.","question":"Raise it now or we won't take it.","answer":"I understand if it doesn't work for you. I can request approval, but I can't confirm an increase I haven't been authorized to make.","alternatives":["Let me check approval. If the current terms don't fit, we'll keep the conversation professional and move on."],"coaching":"Be firm about authority while respecting the other side's choice.","goals":[["approval","authorized"],["request","check"],["understand"]],"facts":[],"term":"Authorized: permitted by the person or agreement controlling the decision.","difficulty":2,"chunks":["I understand if it doesn't work for you.","I can request approval, but I can't confirm an increase I haven't been authorized to make."],"easyAnswer":"I understand if it doesn't work for you. I can request approval, but I can't check an increase I haven't been authorized to make.","easyQuestion":""},{"id":"dispatcher-027","role":"dispatcher","category":"Clarification","title":"Read a detention request","context":"Terms allow $50 per payable hour and 3 payable hours are verified.","question":"Can you confirm our detention amount?","answer":"The calculation is 3 payable hours at $50, totaling $150. I'll verify the evidence and approval against the written terms.","alternatives":["I have a $150 request based on 3 hours at $50; I'll review timestamps and authorization."],"coaching":"Repeat the arithmetic correctly, then distinguish calculation from approval.","goals":[["terms","evidence","timestamp"],["approval","authorization"]],"facts":["3","50","150"],"term":"Payable hours: waiting time eligible under the stated agreement.","difficulty":2,"chunks":["The calculation is 3 payable hours at $50, totaling $150.","I'll verify the evidence and approval against the written terms."],"easyAnswer":"The calculation is 3 payable hours at $50, totaling $150. I'll check the evidence and approval against the written terms.","easyQuestion":"Can you confirm our payment for waiting amount?"},{"id":"dispatcher-028","role":"dispatcher","category":"Clarification","title":"Verify a new contact","context":"A new email asks the carrier to reroute loaded freight.","question":"Can you confirm this new email is really yours?","answer":"Please verify the request using our established company contact before acting. I'll confirm the authorized instructions through that channel.","alternatives":["Use our known contact to check the new email; don't rely only on the message that changed the destination."],"coaching":"A suspicious message cannot verify itself.","goals":[["verify","check"],["established","known","company"],["instructions","contact"]],"facts":[],"term":"Independent verification: checking through a separate trusted channel.","difficulty":2,"chunks":["Please verify the request using our established company contact before acting.","I'll confirm the authorized instructions through that channel."],"easyAnswer":"Please check the request using our established company contact before acting. I'll check the authorized instructions through that channel.","easyQuestion":""},{"id":"dispatcher-029","role":"dispatcher","category":"Clarification","title":"Receiving queue complaint","context":"The carrier is checked in within the FCFS window but is waiting for a dock.","question":"You said FCFS. Why aren't they unloading us?","answer":"FCFS describes the receiving order, not an immediate dock guarantee. I'll contact the facility for a queue update and document the wait.","alternatives":["Let me check the dock queue and waiting timeline; FCFS doesn't promise zero waiting."],"coaching":"Acknowledge the actual wait and find useful information instead of blaming the driver.","goals":[["queue","wait"],["facility","dock"],["update","document"]],"facts":[],"term":"Dock: the facility position where freight is loaded or unloaded.","difficulty":3,"chunks":["FCFS describes the receiving order, not an immediate dock guarantee.","I'll contact the facility for a queue update and document the wait."],"easyAnswer":"FCFS describes the receiving order, not an immediate dock guarantee. I'll contact the facility for a queue update and document the wait.","easyQuestion":"You said first come, first served. Why aren't they unloading us?","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"dispatcher-030","role":"dispatcher","category":"Clarification","title":"Say no to an undocumented change","context":"Your customer requests an extra stop but has not supplied the address or time.","question":"Should I just tell my driver to make the extra stop?","answer":"Please wait for the written address, appointment, and agreed extra work terms. We need to confirm feasibility first.","alternatives":["I'll send complete revised instructions; don't dispatch the added stop until the details and terms are confirmed."],"coaching":"An extra stop needs enough information for a real operating decision.","goals":[["written","revised"],["address"],["appointment"],["terms","feasibility"]],"facts":[],"term":"Added stop: an extra facility visit beyond the original route.","difficulty":3,"chunks":["Please wait for the written address, appointment, and agreed extra work terms.","We need to confirm feasibility first."],"easyAnswer":"Please wait for the written address, appointment, and agreed extra work terms. We need to check feasibility first.","easyQuestion":""},{"id":"driver-001","role":"driver","category":"Check calls","title":"Start the driver call","context":"You are dispatch calling fictional driver Omar; first check that he can talk safely.","question":"Hi dispatch, what's up?","answer":"Hi Omar, is this a safe time to talk, or should I call you back when you're parked?","alternatives":["Omar, can you talk safely now? I can call back after you stop."],"coaching":"A driver call begins with whether a conversation is safe, especially if details must be written down.","goals":[["safe"],["call back","parked","stop"]],"facts":[],"term":"Check call: a planned conversation about trip status.","difficulty":1,"chunks":["Hi Omar, is this a safe time to talk, or should I call you back when you're parked?"],"easyAnswer":"Hi Omar, is this a safe time to talk, or should I call you back when you're parked?","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"driver-002","role":"driver","category":"Check calls","title":"Confirm empty status","context":"P-101 has delivered but you have not received an empty release.","question":"Can you start looking for my next load?","answer":"Yes, but first confirm you're empty and released, your current location, and your available hours.","alternatives":["I'll look once you confirm the trailer is empty, you're released, and I have your location and remaining hours."],"coaching":"Delivered and empty are different statuses. Verify before quoting availability.","goals":[["empty"],["released"],["location"],["hours"]],"facts":[],"term":"Empty release: confirmation that unloading is complete and the truck is free.","difficulty":1,"chunks":["Yes, but first confirm you're empty and released, your current location, and your available hours."],"easyAnswer":"Yes, but first check you're empty and released, your current location, and your available hours.","easyQuestion":""},{"id":"driver-003","role":"driver","category":"Check calls","title":"Ask for remaining hours","context":"The next pickup timing depends on the driver's verified hours.","question":"What do you need from my ELD before booking?","answer":"Please confirm your available driving and duty hours and when your next required break or rest is due.","alternatives":["I need your remaining driving and duty time, plus your break and rest plan."],"coaching":"Ask the driver for the actual available time; do not estimate from the wall clock.","goals":[["driving"],["duty"],["break","rest"],["available","remaining"]],"facts":[],"term":"ELD: electronic logging device.","difficulty":1,"chunks":["Please confirm your available driving and duty hours and when your next required break or rest is due."],"easyAnswer":"Please check your available driving and duty hours and when your next needed break or rest is due.","easyQuestion":""},{"id":"driver-004","role":"driver","category":"Check calls","title":"Verify ETA","context":"The location feed is stale; dispatch needs an updated estimate.","question":"Why are you asking where I am if you have tracking?","answer":"The tracking update is old. Please confirm your current location and a realistic ETA when it's safe to do so.","alternatives":["I don't have a fresh verified position, so I need your location and arrival estimate when you're safely stopped."],"coaching":"Do not present an old location as live. Make the evidence source clear.","goals":[["location"],["ETA","arrival"],["old","fresh","stale"],["safe"]],"facts":[],"term":"Stale tracking: location data that is no longer current.","difficulty":1,"chunks":["The tracking update is old.","Please confirm your current location and a realistic ETA when it's safe to do so."],"easyAnswer":"The tracking update is old. Please check your current location and a realistic ETA when it's safe to do so.","easyQuestion":""},{"id":"driver-005","role":"driver","category":"Check calls","title":"Read pickup instructions","context":"The confirmed appointment is Monday 9 AM Eastern in Columbus.","question":"When do I need to be at the shipper?","answer":"Your pickup is Monday at 9 AM Eastern in Columbus. Please review the written address and reference when parked.","alternatives":["Columbus pickup is Monday, 9 AM Eastern. Check the full address and pickup number before departure."],"coaching":"Say day, time zone, location, and how the driver can check the full details.","goals":[["Monday"],["Eastern"],["Columbus"],["address"]],"facts":["9am"],"term":"Dispatch instructions: the trip information sent to the driver.","difficulty":1,"chunks":["Your pickup is Monday at 9 AM Eastern in Columbus.","Please review the written address and reference when parked."],"easyAnswer":"Your pickup is Monday at 9 AM Eastern in Columbus. Please review the written address and reference when parked.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"driver-006","role":"driver","category":"Check calls","title":"Driver read-back","context":"You need confirmation that Omar heard 9 AM, not 9 PM.","question":"Okay, I think I got it. Anything else?","answer":"Please read back the pickup day, time, time zone, and city so we can catch any misunderstanding.","alternatives":["Could you repeat the appointment and location back to me, including AM or PM and the time zone?"],"coaching":"A read-back checks communication; a vague okay does not prove the timing was heard correctly.","goals":[["read back","repeat"],["time"],["zone"],["city","location"]],"facts":[],"term":"Closed-loop communication: receiving and confirming the same information.","difficulty":1,"chunks":["Please read back the pickup day, time, time zone, and city so we can catch any misunderstanding."],"easyAnswer":"Please read back the pickup day, time, time zone, and city so we can catch any misunderstanding.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"driver-007","role":"driver","category":"Check calls","title":"Trailer inspection","context":"The next load needs a clean, dry trailer; inspection is pending.","question":"Can I head straight over to pickup?","answer":"Please inspect the trailer for cleanliness, moisture, odors, and damage first, then confirm it meets the load requirements.","alternatives":["Check that the van is clean, dry, odor-free, and undamaged before we confirm suitability."],"coaching":"A previous load can leave residue or damage; verify actual condition.","goals":[["inspect","check"],["clean"],["dry","moisture"],["odor"],["damage"]],"facts":[],"term":"Trailer inspection: checking the trailer's current condition.","difficulty":1,"chunks":["Please inspect the trailer for cleanliness, moisture, odors, and damage first, then confirm it meets the load requirements."],"easyAnswer":"Please inspect the trailer for cleanliness, moisture, odors, and damage first, then check it meets the load requirements.","easyQuestion":""},{"id":"driver-008","role":"driver","category":"Check calls","title":"Driver cannot talk","context":"Omar says he is maneuvering into a dock.","question":"Can you give me the new details now?","answer":"Finish docking safely. I'll send the written details and call back after you're parked and ready.","alternatives":["No rush; focus on the dock. We'll review the instructions once you're safely stopped."],"coaching":"Do not demand note-taking during a driving maneuver.","goals":[["dock"],["safe","stopped","parked"],["call back","review"]],"facts":[],"term":"Maneuver: moving the truck carefully into position.","difficulty":1,"chunks":["Finish docking safely.","I'll send the written details and call back after you're parked and ready."],"easyAnswer":"Finish docking safely. I'll send the written details and call back after you're parked and ready.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"driver-009","role":"driver","category":"Pickup","title":"Missing pickup reference","context":"The guard will not admit the driver without a pickup number.","question":"The gate won't let me in. What do I do?","answer":"Stay safely parked and tell me exactly which reference the gate needs. I'll obtain the correct pickup number from the broker.","alternatives":["Let me confirm the gate's required number with the broker while you wait in a safe place."],"coaching":"Identify the exact missing reference before searching or sending unrelated numbers.","goals":[["safe"],["reference","number"],["broker"]],"facts":[],"term":"Guard check-in: initial verification at a facility entrance.","difficulty":1,"chunks":["Stay safely parked and tell me exactly which reference the gate needs.","I'll obtain the correct pickup number from the broker."],"easyAnswer":"Stay safely parked and tell me exactly which reference the gate needs. I'll get the correct pickup number from the broker.","easyQuestion":""},{"id":"driver-010","role":"driver","category":"Pickup","title":"Wrong facility","context":"The driver is at the wrong entrance for a large industrial complex.","question":"GPS says I've arrived, but this gate says no trucks.","answer":"Don't use a restricted entrance. Park safely and check the written truck entrance instructions while I verify with the facility.","alternatives":["Stay clear of the restricted gate; I'll confirm the commercial entrance and send the directions."],"coaching":"A map pin is not permission to enter a restricted road or gate.","goals":[["restricted"],["safe"],["entrance"],["verify","confirm","check"]],"facts":[],"term":"Truck entrance: the facility access intended for commercial vehicles.","difficulty":1,"chunks":["Don't use a restricted entrance.","Park safely and check the written truck entrance instructions while I verify with the facility."],"easyAnswer":"Don't use a restricted entrance. Park safely and check the written truck entrance instructions while I check with the facility.","easyQuestion":""},{"id":"driver-011","role":"driver","category":"Pickup","title":"Loading delay","context":"The driver checked in and has waited without a dock assignment.","question":"They're still not loading me. Should I leave?","answer":"Please stay in the authorized waiting area and send your check-in time. I'll contact the broker for instructions before any departure decision.","alternatives":["Send the arrival evidence and current status; I'll get directions from the broker before we change the plan."],"coaching":"A delay needs documentation and coordination; do not abandon a pickup without instructions.","goals":[["check in","arrival"],["time","evidence"],["broker"],["instructions","directions"]],"facts":[],"term":"Waiting area: a location designated by the facility for queued trucks.","difficulty":1,"chunks":["Please stay in the authorized waiting area and send your check-in time.","I'll contact the broker for instructions before any departure decision."],"easyAnswer":"Please stay in the authorized waiting area and send your check-in time. I'll contact the broker for instructions before any departure decision.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"driver-012","role":"driver","category":"Pickup","title":"BOL before departure","context":"The driver says loading is complete but has not checked the BOL.","question":"I'm loaded. Can I roll?","answer":"Before departing, check the BOL load details, destination, counts, and seal against the instructions, and send a readable copy.","alternatives":["Verify the shipment paperwork and seal first; please send a clear BOL image before you leave."],"coaching":"Loaded does not by itself mean the paperwork and seal are correct.","goals":[["BOL","paperwork"],["destination","details"],["seal"],["copy","image"]],"facts":[],"term":"Roll: leave or begin driving, in informal trucking speech.","difficulty":1,"chunks":["Before departing, check the BOL load details, destination, counts, and seal against the instructions, and send a readable copy."],"easyAnswer":"Before departing, check the BOL load details, destination, counts, and seal against the instructions, and send a readable copy.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"driver-013","role":"driver","category":"Pickup","title":"Weight concern","context":"The loaded trailer feels heavy and the driver has no verified axle weights.","question":"It feels heavy. Do you want me to keep going?","answer":"Don't guess about legal weight. Use an appropriate scale and report the actual axle and gross weights so we can resolve any issue.","alternatives":["We need verified scale weights and a lawful load plan before continuing with a suspected overweight problem."],"coaching":"Escalate the concern and get real measurements; dispatch cannot make weight legal by reassurance.","goals":[["scale"],["axle"],["gross","weight"],["legal","lawful"]],"facts":[],"term":"Gross weight: the combined loaded vehicle weight.","difficulty":2,"chunks":["Don't guess about legal weight.","Use an appropriate scale and report the actual axle and gross weights so we can resolve any issue."],"easyAnswer":"Don't guess about legal weight. Use an right scale and report the actual axle and gross weights so we can resolve any issue.","easyQuestion":""},{"id":"driver-014","role":"driver","category":"Pickup","title":"Seal application","context":"The shipping documents specify that a numbered seal is required after loading.","question":"Should I put the seal on before checking the paperwork?","answer":"First confirm the load details and authorized seal procedure, then record the applied seal number on the required documents.","alternatives":["Verify the paperwork and seal instructions, and document the actual number when the seal is applied."],"coaching":"Follow the shipper's authorized process and preserve the recorded seal information.","goals":[["confirm","verify"],["seal"],["number"],["document","paperwork"]],"facts":[],"term":"Applied seal: the seal actually placed on the trailer.","difficulty":2,"chunks":["First confirm the load details and authorized seal procedure, then record the applied seal number on the required documents."],"easyAnswer":"First check the load details and authorized seal procedure, then record the applied seal number on the needed documents.","easyQuestion":""},{"id":"driver-015","role":"driver","category":"Pickup","title":"Damaged freight at pickup","context":"The driver sees damaged cartons during loading.","question":"Some boxes are crushed. Should I ignore them?","answer":"Document the condition with clear photos and the required notations, then notify me before you sign or depart.","alternatives":["Please record the damage and tell me now; we need instructions and accurate paperwork before departure."],"coaching":"Do not instruct a driver to hide visible damage or sign an inaccurate condition statement.","goals":[["damage","condition"],["photo"],["notation","paperwork"],["before"]],"facts":[],"term":"Visible damage: cargo harm apparent during inspection.","difficulty":2,"chunks":["Document the condition with clear photos and the required notations, then notify me before you sign or depart."],"easyAnswer":"Document the condition with clear photos and the needed notations, then tell me before you sign or depart.","easyQuestion":""},{"id":"driver-016","role":"driver","category":"Pickup","title":"Securement uncertainty","context":"The load bars do not appear suitable for the cargo arrangement.","question":"These bars don't look right. Is it okay?","answer":"Don't proceed on a guess. Have the securement concern checked by the appropriate qualified person and send me the verified outcome.","alternatives":["Pause and get the load restraint assessed before departure; I'll coordinate any needed instructions."],"coaching":"Dispatch should coordinate qualified review rather than approve unseen restraint equipment.","goals":[["securement","restraint"],["check","assessed"],["before","pause"]],"facts":[],"term":"Load restraint: equipment and methods preventing cargo movement.","difficulty":2,"chunks":["Don't proceed on a guess.","Have the securement concern checked by the appropriate qualified person and send me the verified outcome."],"easyAnswer":"Don't go ahead on a guess. Have the securement concern checked by the right qualified person and send me the checked outcome.","easyQuestion":""},{"id":"driver-017","role":"driver","category":"In transit","title":"New delay","context":"The driver reports a road closure and the ETA is uncertain.","question":"The highway is closed. What should I tell the broker?","answer":"Send me the confirmed location and closure details. I'll notify the broker and update the ETA after we have a feasible route.","alternatives":["Give me verified facts first; I'll report the delay and revise the arrival estimate once the route is clear."],"coaching":"Avoid giving an invented arrival estimate while the routing decision is unresolved.","goals":[["location","facts"],["broker"],["ETA","arrival"],["route"]],"facts":[],"term":"Road closure: a section of road unavailable to traffic.","difficulty":2,"chunks":["Send me the confirmed location and closure details.","I'll notify the broker and update the ETA after we have a feasible route."],"easyAnswer":"Send me the confirmed location and closure details. I'll tell the broker and update the ETA after we have a feasible route.","easyQuestion":""},{"id":"driver-018","role":"driver","category":"In transit","title":"Breakdown sequence","context":"The driver reports a mechanical problem and has not stated whether he is safely stopped.","question":"I've got a mechanical problem. What now?","answer":"Are you safely stopped? Follow the carrier's breakdown procedure, and I'll coordinate approved support and notify the broker with confirmed facts.","alternatives":["Get to a safe position according to the situation, then we'll arrange authorized assistance and update the broker."],"coaching":"Start with the driver's immediate status and the established support procedure.","goals":[["safe"],["support","assistance"],["broker"],["procedure","authorized"]],"facts":[],"term":"Roadside support: assistance arranged for a disabled vehicle.","difficulty":2,"chunks":["Are you safely stopped?","Follow the carrier's breakdown procedure, and I'll coordinate approved support and notify the broker with confirmed facts."],"easyAnswer":"Are you safely stopped? Follow the carrier's breakdown procedure, and I'll coordinate approved support and tell the broker with confirmed facts.","easyQuestion":""},{"id":"driver-019","role":"driver","category":"In transit","title":"Repair time unknown","context":"The driver says the vendor is still diagnosing the truck.","question":"The broker wants an ETA. What should I say?","answer":"Tell me the confirmed diagnosis status. We will say repair timing is unconfirmed and provide the next update after the vendor assessment.","alternatives":["Don't guess a completion time; report what the vendor knows and when we'll hear more."],"coaching":"An honest status and next update are useful even without a repair ETA.","goals":[["unconfirmed","don't guess","not confirmed"],["vendor"],["update"]],"facts":[],"term":"Diagnosis: identifying the cause of a mechanical problem.","difficulty":2,"chunks":["Tell me the confirmed diagnosis status.","We will say repair timing is unconfirmed and provide the next update after the vendor assessment."],"easyAnswer":"Tell me the confirmed diagnosis status. We'll say repair timing is unconfirmed and give the next update after the vendor assessment.","easyQuestion":"The broker wants an arrival time. What should I say?"},{"id":"driver-020","role":"driver","category":"In transit","title":"Rest and appointment conflict","context":"The driver needs required rest before the existing delivery time.","question":"I can't make delivery without skipping rest.","answer":"Take the required rest. I'll notify the broker and request an appointment that fits your available hours.","alternatives":["We'll protect your rest plan and seek a feasible delivery time through the broker."],"coaching":"Do not ask a driver to hide a rest requirement or promise an infeasible arrival.","goals":[["rest"],["broker"],["appointment","delivery"],["hours","feasible"]],"facts":[],"term":"Rest plan: the driver's required rest and next available working period.","difficulty":2,"chunks":["Take the required rest.","I'll notify the broker and request an appointment that fits your available hours."],"easyAnswer":"Take the needed rest. I'll tell the broker and request an appointment that fits your available hours.","easyQuestion":""},{"id":"driver-021","role":"driver","category":"In transit","title":"Tracking problem","context":"The tracking app shows an expired invitation.","question":"This link says expired. What do I do?","answer":"When parked, send me the error message. I'll request a new invitation and give the broker verified check-call updates meanwhile.","alternatives":["Let me replace the expired tracking link; we can use confirmed status calls until it works."],"coaching":"Resolve the real error rather than claiming the tracking system is active.","goals":[["expired","error"],["new","replace"],["update","call"],["parked"]],"facts":[],"term":"Expired link: an invitation that is no longer valid.","difficulty":2,"chunks":["When parked, send me the error message.","I'll request a new invitation and give the broker verified check-call updates meanwhile."],"easyAnswer":"When parked, send me the error message. I'll request a new invitation and give the broker checked check-call updates meanwhile.","easyQuestion":""},{"id":"driver-022","role":"driver","category":"In transit","title":"Weather uncertainty","context":"The driver reports poor visibility and does not know the delay length.","question":"Do you still want me to push through this weather?","answer":"Use your safe driving judgment and the carrier's procedure. Tell me your verified status when safe, and I'll update the appointment plan.","alternatives":["Don't promise arrival through unsafe conditions; I'll coordinate the delay using your confirmed situation."],"coaching":"The driver needs a feasible plan and calm support, not pressure to meet an arbitrary ETA.","goals":[["safe"],["procedure","judgment"],["update","coordinate"],["status","situation"]],"facts":[],"term":"Visibility: how far a driver can see conditions ahead.","difficulty":2,"chunks":["Use your safe driving judgment and the carrier's procedure.","Tell me your verified status when safe, and I'll update the appointment plan."],"easyAnswer":"Use your safe driving judgment and the carrier's procedure. Tell me your checked status when safe, and I'll update the appointment plan.","easyQuestion":""},{"id":"driver-023","role":"driver","category":"In transit","title":"Keep appointment timezone","context":"You are in Kandahar; the receiver is in Central time.","question":"Your message says eight. Is that your time or mine?","answer":"The appointment is 8 AM Central at the receiver. Use the facility time zone, not our office time in Kandahar.","alternatives":["It's 8 AM Central, the receiver's local time. I'll write the time zone explicitly."],"coaching":"Always attach the clock time to the facility's zone; office location does not redefine the appointment.","goals":[["Central"],["receiver","facility"]],"facts":["8am"],"term":"Central time: the time zone stated by this fictional receiver.","difficulty":2,"chunks":["The appointment is 8 AM Central at the receiver.","Use the facility time zone, not our office time in Kandahar."],"easyAnswer":"The appointment is 8 AM Central at the receiver. Use the facility time zone, not our office time in Kandahar.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again n safe.","easyQuestion":""},{"id":"driver-026","role":"driver","category":"Delivery","title":"Lumper request","context":"The receiver asks the driver for an unloading service payment.","question":"They want money to unload. Should I pay?","answer":"Send the amount and facility details. I'll obtain authorization and the approved payment method before payment; keep the receipt.","alternatives":["Let me verify the lumper charge with the broker first, then we'll arrange approved payment and save proof."],"coaching":"Authorization, payment, and receipt collection are separate steps.","goals":[["amount"],["authorization","approved","verify"],["payment"],["receipt","proof"]],"facts":[],"term":"Lumper receipt: evidence of the unloading-service payment.","difficulty":2,"chunks":["Send the amount and facility details.","I'll obtain authorization and the approved payment method before payment; keep the receipt."],"easyAnswer":"Send the amount and facility details. I'll get authorization and the approved payment method before payment. keep the receipt.","easyQuestion":""},{"id":"driver-027","role":"driver","category":"Delivery","title":"Receiver shortage","context":"The receiver counts fewer pallets than expected.","question":"They say one pallet is missing. Should I sign clear?","answer":"Do not sign a statement that contradicts the known exception. Record the count and notation accurately, and send me the documents and photos.","alternatives":["Document the receiver's reported shortage and the actual count; we'll escalate the discrepancy with evidence."],"coaching":"Keep the record factual. Do not erase or conceal the exception.","goals":[["count"],["notation","document"],["photo","evidence"],["shortage","exception"]],"facts":[],"term":"Sign clear: sign without an exception, only when accurate.","difficulty":2,"chunks":["Do not sign a statement that contradicts the known exception.","Record the count and notation accurately, and send me the documents and photos."],"easyAnswer

efore booking."],"coaching":"Empty miles affect both cost and the ability to arrive.","goals":[["deadhead","empty"],["hours"],["appointment","plan"]],"facts":["85"],"term":"Deadhead: travel without paying freight on the trailer.","difficulty":3,"chunks":["The next pickup is 85 deadhead miles away.","Let's check your hours, route, and appointment before accepting."],"easyAnswer":"The next pickup is 85 deadhead miles away. Let's check your hours, route, and appointment before accepting.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"driver-034","role":"driver","category":"Planning","title":"Equipment mismatch","context":"A new posting requires a reefer; your truck has a Dry Van.","question":"Can we take the temperature-controlled load?","answer":"No, this truck has a dry van without refrigeration. We need a load that matches our equipment.","alternatives":["Our van can't provide temperature control; I'll look for appropriate dry freight."],"coaching":"Equipment suitability is a critical fact, not a negotiation preference.","goals":[["dry van","van"],["without refrigeration","can't provide","no refrigeration"],["matches","appropriate","load"]],"facts":[],"term":"Reefer: a refrigerated trailer.","difficulty":3,"chunks":["No, this truck has a dry van without refrigeration.","We need a load that matches our equipment."],"easyAnswer":"No, this truck has a dry van without refrigeration. We need a load that matches our truck or trailer.","easyQuestion":""},{"id":"driver-035","role":"driver","category":"Planning","title":"Driver rejects timing","context":"The driver says your proposed schedule is not feasible.","question":"That appointment doesn't work with my hours.","answer":"Thanks for checking. Give me your next feasible arrival time, and I'll review the load or ask for a different appointment.","alternatives":["Let's use your verified hours and a realistic ETA to adjust the plan before booking."],"coaching":"Treat the driver's hours as planning information and resolve the mismatch.","goals":[["hours"],["feasible","realistic"],["appointment","plan"],["before","adjust"]],"facts":[],"term":"Trip plan: a workable sequence of driving, rest, and facility visits.","difficulty":3,"chunks":["Thanks for checking.","Give me your next feasible arrival time, and I'll review the load or ask for a different appointment."],"easyAnswer":"Thanks for checking. Give me your next feasible arrival time, and I'll review the load or ask for a different appointment.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"driver-036","role":"driver","category":"Planning","title":"Driver change","context":"A different driver may take the truck but the handover is not yet confirmed.","question":"Someone else may drive this load. Can you just change the name?","answer":"I'll confirm the authorized driver assignment, availability, and document updates before changing the dispatch record.","alternatives":["We need the actual assigned driver and an approved handover, then we'll update the load details."],"coaching":"A possible substitute is not a verified driver assignment.","goals":[["confirm","confirmed"],["driver"],["authorized","approved"],["update"]],"facts":[],"term":"Driver assignment: the confirmed person responsible for the trip.","difficulty":3,"chunks":["I'll confirm the authorized driver assignment, availability, and document updates before changing the dispatch record."],"easyAnswer":"I'll check the authorized driver assignment, availability, and document updates before changing the dispatch record.","easyQuestion":""},{"id":"driver-037","role":"driver","category":"Planning","title":"Maintenance clearance","context":"The truck has an unresolved defect report.","question":"Can you still book me while this defect is open?","answer":"I won't mark the truck ready until authorized personnel confirm the defect status and release it for service.","alternatives":["Let's get the equipment status cleared through the proper maintenance process before confirming availability."],"coaching":"Do not transform an unresolved equipment issue into a ready status.","goals":[["defect"],["authorized","maintenance"],["before","until"],["ready","availability"]],"facts":[],"term":"Release for service: authorized confirmation that equipment can return to work.","difficulty":3,"chunks":["I won't mark the truck ready until authorized personnel confirm the defect status and release it for service."],"easyAnswer":"I won't mark the truck ready until authorized personnel check the defect status and release it for service.","easyQuestion":""},{"id":"driver-038","role":"driver","category":"Planning","title":"New stop uncertainty","context":"The driver receives a verbal request at the facility for an extra delivery.","question":"The shipper wants me to take a second stop. Shall I go?","answer":"Please pause that change while I verify it with the broker and obtain written addresses, times, and agreed terms.","alternatives":["Don't commit the added stop yet; I'll get authorized revised instructions and check feasibility."],"coaching":"Facility conversation alone may not establish an authorized route and pay change.","goals":[["broker"],["written","revised"],["address","instructions"],["pause","not"]],"facts":[],"term":"Route change: a modification to the planned sequence of locations.","difficulty":3,"chunks":["Please pause that change while I verify it with the broker and obtain written addresses, times, and agreed terms."],"easyAnswer":"Please pause that change while I check it with the broker and get written addresses, times, and agreed terms.","easyQuestion":""},{"id":"driver-039","role":"driver","category":"Planning","title":"Final trip recap","context":"The truck has delivered, is released, and has submitted clear documents.","question":"Are we finished with this load?","answer":"I'll verify the POD, any receipts, and final times, then close the load record and confirm your next availability.","alternatives":["Once the delivery paperwork and expenses are checked, we'll close the trip and update your empty status."],"coaching":"Close the operating and document loop before moving entirely to the next load.","goals":[["POD","paperwork"],["receipt","expense"],["close"],["availability","empty"]],"facts":[],"term":"Closeout: completing the final checks and records for a load.","difficulty":3,"chunks":["I'll verify the POD, any receipts, and final times, then close the load record and confirm your next availability."],"easyAnswer":"I'll check the POD, any receipts, and final times, then close the load record and check your next availability.","easyQuestion":""},{"id":"driver-040","role":"driver","category":"Planning","title":"Unknown current status","context":"A team member asks for a live position while you have only yesterday's update.","question":"Where am I showing on your screen?","answer":"The last confirmed position is from an older update. Please confirm your current location when safe; I won't present that old position as live.","alternatives":["I have stale tracking, so I need a fresh verified location from you."],"coaching":"Say what you know, the age of the evidence, and the check needed.","goals":[["old","older","stale"],["current","fresh"],["location"],["confirm","verified"]],"facts":[],"term":"Verified position: a location confirmed by a reliable current source.","difficulty":3,"chunks":["The last confirmed position is from an older update.","Please confirm your current location when safe; I won't present that old position as live."],"easyAnswer":"The last confirmed position is from an older update. Please check your current location when safe. I won't present that old position as live.","easyQuestion":""},{"id":"bashir-001","role":"bashir","category":"Owner updates","title":"Morning fleet picture","context":"Bashir is the fictional carrier owner; P-101 is empty and P-102 is still unloading.","question":"Give me the two-truck picture.","answer":"P-101 is empty and released. P-102 is still unloading, so I haven't marked it available. I'll confirm its release before offering it.","alternatives":["One truck is confirmed empty; the other is unloading. I'll update availability after actual release."],"coaching":"Keep actual empty status distinct from expected availability.","goals":[["empty"],["unloading"],["release"],["available","availability"]],"facts":[],"term":"Fleet status: the confirmed operating position of the carrier's trucks.","difficulty":1,"chunks":["P-101 is empty and released.","P-102 is still unloading, so I haven't marked it available.","I'll confirm its release before offering it."],"easyAnswer":"P-101 is empty and released. P-102 is still unloading, so I haven't marked it available. I'll check its release before offering it.","easyQuestion":""},{"id":"bashir-002","role":"bashir","category":"Owner updates","title":"Approval for a low offer","context":"The proposed load is below the carrier's approved decision threshold.","question":"Why are you asking me before booking this load?","answer":"The offer is below our approved threshold. I'll show you the trip cost, deadhead, and schedule so you can decide whether to make an exception.","alternatives":["This needs your approval because it falls outside our agreed limit; here's the cost and timing analysis."],"coaching":"Ask for a decision with useful facts, not just a request to take responsibility.","goals":[["threshold","limit"],["cost"],["deadhead","timing","schedule"],["approval","decide"]],"facts":[],"term":"Decision threshold: a pre-agreed point requiring owner review.","difficulty":1,"chunks":["The offer is below our approved threshold.","I'll show you the trip cost, deadhead, and schedule so you can decide whether to make an exception."],"easyAnswer":"The offer is below our approved threshold. I'll show you the trip cost, deadhead, and schedule so you can decide whether to make an exception.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-003","role":"bashir","category":"Owner updates","title":"Explain loaded versus total miles","context":"The fictional trip has 500 loaded miles and 100 deadhead miles.","question":"Why did you use six hundred miles in your calculation?","answer":"There are 500 loaded miles plus 100 deadhead miles, for 600 total miles. The truck travels both, so I include both in trip planning.","alternatives":["The full trip is 600 miles: 500 paying miles and 100 empty miles."],"coaching":"State the denominator clearly. Loaded-mile RPM and total-mile RPM answer different questions.","goals":[["loaded","paying"],["deadhead","empty"],["total","full"]],"facts":["500","100","600"],"term":"Total miles: loaded miles plus the empty miles included in the plan.","difficulty":1,"chunks":["There are 500 loaded miles plus 100 deadhead miles, for 600 total miles.","The truck travels both, so I include both in trip planning."],"easyAnswer":"There are 500 loaded miles plus 100 deadhead miles, for 600 total miles. The truck travels both, so I include both in trip planning.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-004","role":"bashir","category":"Owner updates","title":"RPM calculation","context":"The fictional rate is $1,500 over 600 total miles.","question":"What's the gross rate per total mile?","answer":"It's $2.50 per total mile: $1,500 divided by 600 miles. That's gross revenue, before costs.","alternatives":["Gross RPM on all 600 miles is $2.50 from the $1,500 total; it isn't profit."],"coaching":"Name the basis and distinguish revenue from net earnings.","goals":[["gross","revenue"],["total"],["before costs","isn't profit"]],"facts":["2.50"],"term":"RPM: rate per mile on the specified mileage basis.","difficulty":1,"chunks":["It's $2.50 per total mile: $1,500 divided by 600 miles.","That's gross revenue, before costs."],"easyAnswer":"It's $2.50 per total mile: $1,500 divided by 600 miles. That's gross revenue, before costs.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-005","role":"bashir","category":"Owner updates","title":"Revenue is not profit","context":"A teammate says a $2,500 rate means $2,500 profit.","question":"Is the whole load rate our profit?","answer":"No. The load rate is gross revenue. We still need to deduct fuel, driver pay, operating costs, and other applicable expenses.","alternatives":["It's revenue before expenses; profit depends on the full cost of doing the trip."],"coaching":"Do not report a top-line amount as money left after costs.","goals":[["revenue"],["cost","expense"],["profit"]],"facts":[],"term":"Gross revenue: the money earned before subtracting expenses.","difficulty":1,"chunks":["No.","The load rate is gross revenue.","We still need to deduct fuel, driver pay, operating costs, and other applicable expenses."],"easyAnswer":"No. The load rate is gross revenue. We still need to deduct fuel, driver pay, operating costs, and other needed expenses.","easyQuestion":""},{"id":"bashir-006","role":"bashir","category":"Owner updates","title":"Fuel estimate uncertainty","context":"You have a fuel cost estimate, not a verified final amount.","question":"Is that fuel expense exact?","answer":"It's an estimate based on the planned miles and consumption assumptions. I'll replace it with actual records when available.","alternatives":["That's projected fuel cost, not a final receipt total; I'll reconcile it after the trip."],"coaching":"Label assumptions rather than turning a planning estimate into an accounting fact.","goals":[["estimate","projected"],["actual" p.","alternatives":["Empty equipment isn't enough; I need confirmed driver availability and a feasible arrival plan."],"coaching":"Report the missing check and next action rather than hiding uncertainty.","goals":[["empty"],["driver"],["hours"],["verify","confirmed"]],"facts":[],"term":"Readiness: verified equipment and driver ability to do the proposed work.","difficulty":1,"chunks":["The trailer is empty, but driver hours and readiness still need confirmation.","I'll verify them before promising pickup."],"easyAnswer":"The trailer is empty, but driver hours and readiness still need written confirmation. I'll check them before promising pickup.","easyQuestion":""},{"id":"bashir-009","role":"bashir","category":"Owner updates","title":"Report a risky appointment","context":"The offered delivery conflicts with the verified driver plan.","question":"The rate looks good. What's the issue?","answer":"The delivery appointment doesn't fit the driver's verified hours. I'll request a feasible time or look for another load.","alternatives":["The money works, but the schedule doesn't; we need a new appointment that fits the driver's hours."],"coaching":"Bring the operating issue alongside the commercial opportunity.","goals":[["appointment","schedule"],["hours"],["feasible","new","another"]],"facts":[],"term":"Service risk: a condition likely to prevent the agreed trip performance.","difficulty":1,"chunks":["The delivery appointment doesn't fit the driver's verified hours.","I'll request a feasible time or look for another load."],"easyAnswer":"The delivery appointment doesn't fit the driver's checked hours. I'll request a feasible time or look for another load.","easyQuestion":""},{"id":"bashir-010","role":"bashir","category":"Owner updates","title":"No live market claim","context":"Bashir asks whether the app's fictional offers reflect today's freight market.","question":"Are these real rates from DAT today?","answer":"No. These are fictional training rates. For a real booking we would verify live listings and the actual load terms.","alternatives":["They're practice figures, not current market quotes; real decisions need current verified offers."],"coaching":"Clearly identify practice data and the separate verification needed for live work.","goals":[["fictional","practice"],["rate","figure"],["verify","current","live"]],"facts":[],"term":"Training rate: an invented amount used for learning calculations.","difficulty":1,"chunks":["No.","These are fictional training rates.","For a real booking we would verify live listings and the actual load terms."],"easyAnswer":"No. These are fictional training rates. For a real booking we would check live listings and the actual load terms.","easyQuestion":""},{"id":"bashir-011","role":"bashir","category":"Decisions","title":"Request specific rate approval","context":"A fictional counteroffer of $2,450 is below your delegated limit.","question":"What exactly do you need me to approve?","answer":"Please approve or decline $2,450 all-in for this specific trip after reviewing the deadhead, timing, and cost estimate.","alternatives":["I need your decision on the $2,450 total with this mileage and schedule; I haven't committed the truck."],"coaching":"Ask a precise decision and keep commitment status clear.","goals":[["approve","decision"],["trip","mileage"],["timing","schedule"],["cost"]],"facts":["2450"],"term":"Delegated limit: the decision range assigned to a team member.","difficulty":1,"chunks":["Please approve or decline $2,450 all-in for this specific trip after reviewing the deadhead, timing, and cost estimate."],"easyAnswer":"Please approve or decline $2,450 all-in for this specific trip after reviewing the deadhead, timing, and cost estimate.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-012","role":"bashir","category":"Decisions","title":"Protect confidential documents","context":"An unverified new contact requests the carrier's packet.","question":"Why didn't you send our documents immediately?","answer":"The contact is unverified. I'll confirm the company and recipient independently before sharing the carrier packet.","alternatives":["I paused the document request until I can verify the recipient through an established company channel."],"coaching":"Describe the actual missing verification, not an accusation without evidence.","goals":[["unverified","verify"],["recipient","contact"],["company"],["before","paused"]],"facts":[],"term":"Recipient verification: confirming who will receive the information.","difficulty":1,"chunks":["The contact is unverified.","I'll confirm the company and recipient independently before sharing the carrier packet."],"easyAnswer":"The contact is unverified. I'll check the company and recipient independently before sharing the carrier packet.","easyQuestion":""},{"id":"bashir-013","role":"bashir","category":"Decisions","title":"Explain a rejected reefer load","context":"The posting requires refrigeration; both trucks have Dry Vans.","question":"Why did you pass on the high-paying refrigerated load?","answer":"Our trucks have dry vans without refrigeration. The load requires temperature control, so our equipment doesn't match.","alternatives":["We can't provide the required refrigeration with these vans; I kept searching for suitable dry freight."],"coaching":"A high offer does not fix an equipment mismatch.","goals":[["van"],["refrigeration","temperature"],["match","suitable","can't"]],"facts":[],"term":"Equipment match: meeting the specific trailer and service requirements.","difficulty":2,"chunks":["Our trucks have dry vans without refrigeration.","The load requires temperature control, so our equipment doesn't match."],"easyAnswer":"Our trucks have dry vans without refrigeration. The load requires temperature control, so our truck or trailer doesn't match.","easyQuestion":""},{"id":"bashir-014","role":"bashir","category":"Decisions","title":"Keep alternatives ready","context":"A broker has not approved your requested rate.","question":"What are you doing while waiting for the broker?","answer":"I'm keeping that offer pending and reviewing other suitable loads without double-booking the truck.","alternatives":["I'll follow up on the rate and search alternatives, while keeping one clear commitment status."],"coaching":"Search can continue, but one truck cannot hold conflicting confirmed commitments.","goals":[["pending","wait"],["other","alternative"],["double","commitment"]],"facts":[],"term":"Pending offer: a proposal still awaiting agreement.","difficulty":2,"chunks":["I'm keeping that offer pending and reviewing other suitable loads without double-booking the truck."],"easyAnswer":"I'm keeping that offer pending and reviewing other suitable loads without double-booking the truck.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-015","role":"bashir","category":"Decisions","title":"Added stop approval","context":"The broker adds a second delivery after you agreed the original trip.","question":"Can you accept that extra stop yourself?","answer":"I'll compare it with my approval limit and review the address, timing, miles, and compensation before agreeing or escalating to you.","alternatives":["I need the complete revised trip and my decision authority before confirming the added work."],"coaching":"Know the proposed work and delegated authority before accepting a change.","goals":[["address"],["timing","schedule"],["mile"],["compensation","pay"],["authority","limit"]],"facts":[],"term":"Scope change: additional or different work from the original agreement.","difficulty":2,"chunks":["I'll compare it with my approval limit and review the address, timing, miles, and compensation before agreeing or escalating to you."],"easyAnswer":"I'll compare it with my approval limit and review the address, timing, miles, and compensation before agreeing or escalating to you.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-016","role":"bashir","category":"Decisions","title":"Driver readiness block","context":"A maintenance issue has no release decision yet.","question":"Why is that truck unavailable even though the driver is ready?","answer":"The equipment defect is still unresolved. I'll wait for authorized maintenance clearance before marking the truck ready.","alternatives":["The driver is available, but the truck needs a verified service release before booking."],"coaching":"A driver's availability does not clear an equipment defect.","goals":[["defect","maintenance"],["authorized","verified"],["before","clearance","release"]],"facts":[],"term":"Maintenance clearance: an authorized outcome on equipment readiness.","difficulty":2,"chunks":["The equipment defect is still unresolved.","I'll wait for authorized maintenance clearance before marking the truck ready."],"easyAnswer":"The truck or trailer defect is still unresolved. I'll wait for authorized maintenance clearance before marking the truck ready.","easyQuestion":""},{"id":"bashir-017","role":"bashir","category":"Decisions","title":"Reschedule versus cancellation","context":"A delayed load can still deliver if the receiver agrees a new time.","question":"Do we need to cancel the whole load?","answer":"Not necessarily. I'll verify the delay and ask for a feasible revised appointment, then bring you any decision outside my authority.","alternatives":["First I'll check whether rescheduling solves the problem; if the remaining options exceed my limit, I'll escalate."],"coaching":"Look for a supported operating solution before declaring the trip impossible.","goals":[["verify","check"],["revised","rescheduling"],["appointment"],["authority","limit","escalate"]],"facts":[],"term":"Reschedule: arrange a different appointment time.","difficulty":2,"chunks":["Not necessarily.","I'll verify the delay and ask for a feasible revised appointment, then bring you any decision outside my authority."],"easyAnswer":"Not necessarily. I'll check the delay and ask for a feasible updated appointment, then bring you any decision outside my authority.","easyQuestion":""},{"id":"bashir-018","role":"bashir","category":"Decisions","title":"No unsupported fee promise","context":"Bashir asks whether a waiting fee is already secured.","question":"Have we earned detention for sure?","answer":"It hasn't been approved yet. We have the waiting evidence, and I'll submit the request under the written agreement.","alternatives":["We have a supported claim to review, not confirmed payment; approval is still pending."],"coaching":"Differentiate evidence, submitted claim, approval, and paid status.","goals":[["not approved","pending","not confirmed"],["written","agreement"],["request","claim"]],"facts":[],"term":"Claim status: the current stage of a requested charge.","difficulty":2,"chunks":["It hasn't been approved yet.","We have the waiting evidence, and I'll submit the request under the written agreement."],"easyAnswer":"It hasn't been approved yet. We have the waiting evidence, and I'll submit the request under the written agreement.","easyQuestion":"Have we earned payment for waiting for sure?","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-019","role":"bashir","category":"Decisions","title":"Correct an earlier report","context":"You reported a truck as empty before actual receiver release.","question":"You said it was empty. What changed?","answer":"I reported availability too early. The truck is still awaiting release; I've corrected the record and will verify before offering it.","alternatives":["My earlier update was premature. I've changed the status to waiting for release and will confirm actual availability."],"coaching":"Own a specific reporting error and correct both the record and dependent plans.","goals":[["corrected","changed"],["release"],["verify","confirm"],["early","premature"]],"facts":[],"term":"Correction: replacing a mistaken record with the verified status.","difficulty":2,"chunks":["I reported availability too early.","The truck is still awaiting release; I've corrected the record and will verify before offering it."],"easyAnswer":"I reported availability too early. The truck is still awaiting release. I've corrected the record and will check before offering it.","easyQuestion":""},{"id":"bashir-020","role":"bashir","category":"Decisions","title":"Callback commitment","context":"You cannot yet answer the owner's question about repair timing.","question":"When will you tell me more?","answer":"I'll update you after the vendor assessment, even if the repair completion time is still unconfirmed.","alternatives":["My next update is after the vendor checks the truck; I'll clearly state anything still unknown."],"coaching":"A useful callback commitment names the event or time that triggers the next report.","goals":[["update"],["vendor"],["assessment","check"],["unconfirmed","unknown"]],"facts":[],"term":"Update trigger: an event that determines when to report again.","difficulty":2,"chunks":["I'll update you after the vendor assessment, even if the repair completion time is still unconfirmed."],"easyAnswer":"I'll update you after the vendor assessment, even if the repair completion time is still unconfirmed.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-021","role":"bashir","category":"Exceptions","title":"Breakdown report to owner","context":"Omar is safely parked; repair completion and final cost are unknown.","question":"Give me the breakdown summary.","answer":"Omar is safely parked. The vendor assessment is pending, so repair timing and cost are unconfirmed. I'm coordinating support and updating the broker.","alternatives":["The driver is safe; we're awaiting diagnosis and verified cost and timing. I'll keep you and the broker informed."],"coaching":"Present safety status, confirmed facts, unknowns, owner, and next action.","goals":[["safe"],["vendor","diagnosis"],["pending","unconfirmed"],["broker"]],"facts":[],"term":"Operational summary: a concise account of status, risk, and next steps.","difficulty":2,"chunks":["Omar is safely parked.","The vendor assessment is pending, so repair timing and cost are unconfirmed.","I'm coordinating support and updating the broker."],"easyAnswer":"Omar is safely parked. The vendor assessment is pending, so repair timing and cost are unconfirmed. I'm coordinating support and updating the broker.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-022","role":"bashir","category":"Exceptions","title":"Detention evidence package","context":"The broker asks for documentation before reviewing waiting compensation.","question":"What are you sending with the detention request?","answer":"The agreed terms, verified arrival and release timeline, and supporting facility or driver evidence. I'll label the amount as requested until approved.","alternatives":["I'll provide timestamps and the written agreement with a calculation, then track the approval status."],"coaching":"A well-supported request is stronger than an angry description of waiting.","goals":[["terms","agreement"],["timeline","timestamp"],["amount","calculation"],["approved","approval"]],"facts":[],"term":"Evidence package: documents and records supporting a factual request.","difficulty":2,"chunks":["The agreed terms, verified arrival and release timeline, and supporting facility or driver evidence.","I'll label the amount as requested until approved."],"easyAnswer":"The agreed terms, checked arrival and release timeline, and supporting facility or driver evidence. I'll label the amount as requested until approved.","easyQuestion":"What are you sending with the payment for waiting request?"},{"id":"bashir-023","role":"bashir","category":"Exceptions","title":"TONU owner report","context":"A canceled load has a potential fee request but no approved amount.","question":"Did the cancellation make us any money?","answer":"No payment is confirmed. I'll review the TONU terms, submit the dispatch and cancellation evidence, and report the approval outcome.","alternatives":["We may have a TONU request under the agreement, but I won't report it as revenue until it's confirmed."],"coaching":"Do not count an unapproved exception charge as secured earnings.","goals":[["TONU"],["terms","agreement"],["evidence"],["confirmed","approval"]],"facts":[],"term":"Secured charge: an amount actually agreed or approved, not merely requested.","difficulty":2,"chunks":["No payment is confirmed.","I'll review the TONU terms, submit the dispatch and cancellation evidence, and report the approval outcome."],"easyAnswer":"No payment is confirmed. I'll review the TONU terms, submit the dispatch and cancellation evidence, and report the approval outcome.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-024","role":"bashir","category":"Exceptions","title":"Document mistake escalation","context":"The broker has not corrected a wrong destination on the rate confirmation.","question":"Why haven't you released the truck?","answer":"The destination is inconsistent across the documents. I'm waiting for verified written correction before dispatching the truck.","alternatives":["We have an unresolved destination mismatch, and I need the authorized corrected instructions before release."],"coaching":"Explain which mismatch blocks the next action.","goals":[["destination"],["mismatch","inconsistent"],["written","corrected"],["before"]],"facts":[],"term":"Dispatch release: permission to proceed after required planning checks.","difficulty":2,"chunks":["The destination is inconsistent across the documents.","I'm waiting for verified written correction before dispatching the truck."],"easyAnswer":"The destination is inconsistent across the documents. I'm waiting for checked written correction before dispatching the truck.","easyQuestion":""},{"id":"bashir-025","role":"bashir","category":"Exceptions","title":"POD recovery","context":"The load delivered but the only delivery image is illegible.","question":"Why is this load not ready for billing?","answer":"The POD isn't readable. I've requested a clear signed copy from the driver and will verify it against the load before billing closeout.","alternatives":["We still need legible delivery evidence; I'm recovering it and checking the shipment details."],"coaching":"Delivered status and billing readiness require different evidence.","goals":[["POD","delivery"],["readable","legible","clear"],["driver"],["verify","check"]],"facts":[],"term":"Billing readiness: having the required verified documents for invoicing.","difficulty":2,"chunks":["The POD isn't readable.","I've requested a clear signed copy from the driver and will verify it against the load before billing closeout."],"easyAnswer":"The POD isn't readable. I've requested a clear signed copy from the driver and will check it against the load before billing closeout.","easyQuestion":""},{"id":"bashir-026","role":"bashir","category":"Exceptions","title":"Cargo damage report","context":"The receiver reported crushed cartons; responsibility is not established.","question":"Are we responsible for this damage?","answer":"The cause and responsibility aren't confirmed. I'll preserve photos and notations, report verified facts, and follow the carrier's escalation process.","alternatives":["We have a reported damage exception, not a confirmed liability finding; I'm collecting the evidence for review."],"coaching":"Avoid unsupported blame or admissions. Keep the operational report factual.","goals":[["not confirmed","aren't confirmed","reported"],["photo","evidence"],["notation"],["escalation","review"]],"facts":[],"term":"Liability: responsibility to be determined through the applicable process.","difficulty":2,"chunks":["The cause and responsibility aren't confirmed.","I'll preserve photos and notations, report verified facts, and follow the carrier's escalation process."],"easyAnswer":"The cause and responsibility aren't confirmed. I'll preserve photos and notations, report checked facts, and follow the carrier's escalation process.","easyQuestion":""},{"id":"bashir-027","role":"bashir","category":"Exceptions","title":"Suspected identity mismatch","context":"A new contact wants the freight redirected to an unfamiliar warehouse.","question":"What's the problem with that reroute request?","answer":"The contact and destination aren't verified. I'll pause the change, independently verify the authorized instructions, and escalate the result.","alternatives":["We have an unverified reroute, so I won't dispatch it until the known company contact confirms it."],"coaching":"Focus on the observed mismatch and independent check rather than accusing someone without evidence.","goals":[["verify","confirmed"],["contact"],["destination","reroute"],["pause","until"]],"facts":[],"term":"Reroute: changing the planned path or destination of a shipment.","difficulty":2,"chunks":["The contact and destination aren't verified.","I'll pause the change, independently verify the authorized instructions, and escalate the result."],"easyAnswer":"The contact and destination aren't checked. I'll pause the change, independently check the authorized instructions, and escalate the result.","easyQuestion":""},{"id":"bashir-028","role":"bashir","category":"Exceptions","title":"Missed appointment ownership","context":"A truck is late; the next receiving time is not yet arranged.","question":"Who is handling the receiver now?","answer":"I'm coordinating the revised appointment through the broker, while the driver provides verified ETA updates. I'll report when a new slot is confirmed.","alternatives":["I own the rescheduling follow-up with the broker; the driver is sending current arrival estimates."],"coaching":"A clear owner prevents two people from assuming the other person has called.","goals":[["broker"],["appointment","rescheduling"],["driver"],["confirmed","update"]],"facts":[],"term":"Action owner: the person responsible for completing the next step.","difficulty":2,"chunks":["I'm coordinating the revised appointment through the broker, while the driver provides verified ETA updates.","I'll report when a new slot is confirmed."],"easyAnswer":"I'm coordinating the updated appointment through the broker, while the driver provides checked ETA updates. I'll report when a new slot is confirmed.","easyQuestion":""},{"id":"bashir-029","role":"bashir","category":"Exceptions","title":"Expense approval","context":"The driver requests an unplanned $180 lumper payment.","question":"What expense needs approval?","answer":"The receiver is requesting a $180 lumper charge. I need authorization and an approved payment method, then I'll collect the receipt.","alternatives":["Please review the $180 unloading expense; we will document approval and retain proof of payment."],"coaching":"State amount, purpose, approval need, and evidence plan.","goals":[["lumper","unloading"],["approval","authorization"],["receipt","proof"],["payment"]],"facts":["180"],"term":"Expense authorization: approval to incur a specific charge.","difficulty":3,"chunks":["The receiver is requesting a $180 lumper charge.","I need authorization and an approved payment method, then I'll collect the receipt."],"easyAnswer":"The receiver is requesting a $180 lumper charge. I need authorization and an approved payment method, then I'll collect the receipt.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-030","role":"bashir","category":"Exceptions","title":"Time zone communication error","context":"A teammate sent Kandahar time without the receiver's local zone.","question":"How will you prevent this appointment confusion again?","answer":"I'll record the facility date, AM or PM, and time zone explicitly, and ask the driver to read it back.","alternatives":["We'll use the receiver's stated local time with a full date and zone, then confirm through a read-back."],"coaching":"Fix the information format and confirmation process, not just one message.","goals":[["facility","receiver"],["date"],["zone"],["read back"]],"facts":[],"term":"Time-zone label: the named zone attached to a scheduled clock time.","difficulty":3,"chunks":["I'll record the facility date, AM or PM, and time zone explicitly, and ask the driver to read it back."],"easyAnswer":"I'll record the facility date, AM or PM, and time zone explicitly, and ask the driver to read it back.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-031","role":"bashir","category":"Reporting","title":"End-of-shift owner update","context":"Two trucks are active with one unresolved pickup delay.","question":"What should your end-of-shift update contain?","answer":"Each truck's verified status, the open delay and its impact, documents, action owner, and next update. I'll identify anything still unconfirmed.","alternatives":["I'll summarize truck status, risks, paperwork, who follows up, and when, with unknowns clearly marked."],"coaching":"Give a decision-ready summary instead of an unfiltered chat history.","goals":[["status"],["risk","delay"],["document","paperwork"],["owner","follow"],["update","when"]],"facts":[],"term":"Shift update: a concise status report at a change of working period.","difficulty":3,"chunks":["Each truck's verified status, the open delay and its impact, documents, action owner, and next update.","I'll identify anything still unconfirmed."],"easyAnswer":"Each truck's checked status, the open delay and its impact, documents, action owner, and next update. I'll identify anything still unconfirmed.","easyQuestion":""},{"id":"bashir-032","role":"bashir","category":"Reporting","title":"Confirm truck utilization","context":"One truck is waiting without a booked load; the other is loaded.","question":"Are both trucks earning right now?","answer":"Only the loaded truck has a confirmed revenue trip. The other is waiting for a suitable confirmed load, and I'm reviewing options.","alternatives":["One truck is on a booked shipment; the empty truck is still available while I evaluate the next load."],"coaching":"Do not confuse available equipment with equipment on a paying trip.","goals":[["one"],["loaded","booked"],["other","empty"],["available","waiting"]],"facts":[],"term":"Utilization: how equipment is being used over a given period.","difficulty":3,"chunks":["Only the loaded truck has a confirmed revenue trip.","The other is waiting for a suitable confirmed load, and I'm reviewing options."],"easyAnswer":"Only the loaded truck has a confirmed revenue trip. The other is waiting for a suitable confirmed load, and I'm reviewing options.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-033","role":"bashir","category":"Reporting","title":"Track a pending negotiation","context":"The broker has promised to ask a customer about your counteroffer.","question":"Is that rate increase approved?","answer":"Not yet. The broker is checking with the customer. I've kept it pending and will verify the written amount before confirming.","alternatives":["The increase is still under review; I need an explicit approval and matching confirmation."],"coaching":"A promise to ask is not an approval.","goals":[["not yet","pending","still"],["approval","approved"],["written","confirmation"]],"facts":[],"term":"Counteroffer: a proposed change to the initial offer.","difficulty":3,"chunks":["Not yet.","The broker is checking with the customer.","I've kept it pending and will verify the written amount before confirming."],"easyAnswer":"Not yet. The broker is checking with the customer. I've kept it pending and will check the written amount before confirming.","easyQuestion":""},{"id":"bashir-034","role":"bashir","category":"Reporting","title":"Explain review score","context":"Bashir asks whether a high browser score proves someone is ready for real calls.","question":"Does a high score prove they are ready to dispatch alone?","answer":"No. It shows practice performance under the app's checks. We still need observed live-style calls, sound judgment, and your authorization for real work.","alternatives":["The score is training evidence; real readiness also requires supervised call review and operational competence."],"coaching":"A rule-based practice score is not certification or precise pronunciation testing.","goals":[["practice","training"],["judgment","competence"],["observed","review"],["authorization","supervised"]],"facts":[],"term":"Assessment: evidence of performance within a defined exercise.","difficulty":3,"chunks":["No.","It shows practice performance under the app's checks.","We still need observed live-style calls, sound judgment, and your authorization for real work."],"easyAnswer":"No. It shows practice performance under the app's checks. We still need observed live-style calls, sound judgment, and your authorization for real work.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-035","role":"bashir","category":"Reporting","title":"Separate verified from expected","context":"A driver expects to be unloaded soon, but the facility has given no release.","question":"Can we say the truck is empty in fifteen minutes?","answer":"We can report an estimated release, clearly labeled. We cannot report confirmed empty status until unloading and release are verified.","alternatives":["I'll call it an expected availability window, not an actual empty release, and update after confirmation."],"coaching":"Keep forecasts and actual events separate in reports and load-board availability.","goals":[["estimated","expected"],["confirmed","verified"],["release","empty"]],"facts":[],"term":"Forecast: an expected future event, not a completed event.","difficulty":3,"chunks":["We can report an estimated release, clearly labeled.","We cannot report confirmed empty status until unloading and release are verified."],"easyAnswer":"We can report an estimated release, clearly labeled. We can't report confirmed empty status until unloading and release are checked.","easyQuestion":""},{"id":"bashir-036","role":"bashir","category":"Reporting","title":"Avoid two incompatible promises","context":"Two brokers want the same truck for overlapping appointments.","question":"Can we accept both and figure it out later?","answer":"No. I'll compare the appointments and capacity, then commit only to a feasible plan for the truck.","alternatives":["We need one workable assignment; I won't make conflicting bookings on the same truck."],"coaching":"Reject conflicting commitments and explain the capacity check needed.","goals":[["appointments"],["capacity","truck"],["feasible","workable"],["conflicting","only"]],"facts":[],"term":"Double-booking: conflicting commitments for the same capacity.","difficulty":3,"chunks":["No.","I'll compare the appointments and capacity, then commit only to a feasible plan for the truck."],"easyAnswer":"No. I'll compare the appointments and capacity, then commit only to a feasible plan for the truck.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bashir-037","role":"bashir","category":"Reporting","title":"Load decline explanation","context":"You declined a load because the driver could not meet the pickup.","question":"Why did you turn down that load?","answer":"The pickup wasn't feasible with the driver's verified location and available hours. I asked for flexibility, then declined when the timing couldn't change.","alternatives":["We couldn't safely and realistically reach the appointment with the actual hours, so I passed after checking alternatives."],"coaching":"Explain the constraint and attempted solution without inventing poor market conditions.","goals":[["pickup","appointment"],["hours"],["location","timing"],["declined","passed"]],"facts":[],"term":"Constraint: a fact that limits available decisions.","difficulty":3,"chunks":["The pickup wasn't feasible with the driver's verified location and available hours.","I asked for flexibility, then declined when the timing couldn't change."],"easyAnswer":"The pickup wasn't feasible with the driver's checked location and available hours. I asked for flexibility, then declined when the timing couldn't change.","easyQuestion":""},{"id":"bashir-038","role":"bashir","category":"Reporting","title":"Reconcile added costs","context":"The first trip estimate excluded a later approved stop charge.","question":"Why did the trip result change from the estimate?","answer":"The original estimate didn't include the later authorized stop and its added miles and costs. I'll show the revised revenue and expenses separately.","alternatives":["The scope changed; I'll reconcile the approved extra work, new revenue, and actual costs against the first estimate."],"coaching":"Make the reason for the difference visible instead of silently overwriting the original estimate.","goals":[["estimate"],["stop","scope"],["revenue"],["cost","expense"],["revised","reconcile"]],"facts":[],"term":"Reconcile: explain and resolve differences between records or estimates.","difficulty":3,"chunks":["The original estimate didn't include the later authorized stop and its added miles and costs.","I'll show the revised revenue and expenses separately."],"easyAnswer":"The original estimate didn't include the later authorized stop and its added miles and costs. I'll show the updated revenue and expenses separately.","easyQuestion":""},{"id":"bashir-039","role":"bashir","category":"Reporting","title":"Make a decision request concise","context":"The owner is busy and needs a short summary of an issue.","question":"Give me the short version and what you need from me.","answer":"The appointment is at risk because of a confirmed breakdown. I'm seeking a revised slot; I need your approval for any repair expense beyond my limit.","alternatives":["Known issue: breakdown. Current action: reschedule. Decision needed: authorization for costs above my delegated limit."],"coaching":"Use status, impact, action, and a specific decision request.","goals":[["breakdown"],["appointment","reschedule"],["approval","authorization"],["limit"]],"facts":[],"term":"Decision request: the specific choice required from the responsible person.","difficulty":3,"chunks":["The appointment is at risk because of a confirmed breakdown.","I'm seeking a revised slot; I need your approval for any repair expense beyond my limit."],"easyAnswer":"The appointment is at risk because of a confirmed breakdown. I'm seeking a updated slot. I need your approval for any repair expense beyond my limit.","easyQuestion":""},{"id":"bashir-040","role":"bashir","category":"Reporting","title":"Close the reporting loop","context":"An amended confirmation has arrived and the driver has read back the new time.","question":"Is that issue fully resolved?","answer":"The corrected confirmation matches the agreed appointment, and the driver has read it back. I've updated the record and closed the issue.","alternatives":["Yes, the written terms and driver acknowledgment now match; the corrected details are saved in the load record."],"coaching":"An issue is resolved when the source document, operational plan, and communication agree.","goals":[["confirmation","written"],["driver"],["match"],["record"]],"facts":[],"term":"Acknowledgment: explicit confirmation that information was received and understood.","difficulty":3,"chunks":["The corrected confirmation matches the agreed appointment, and the driver has read it back.","I've updated the record and closed the issue."],"easyAnswer":"The corrected written confirmation matches the agreed appointment, and the driver has read it back. I've updated the record and closed the issue.","easyQuestion":""},{"id":"bilal-001","role":"bilal","category":"Team handover","title":"Open the shift handover","context":"Bilal is taking over the desk while Kari goes off shift.","question":"What do I need first for this handover?","answer":"Let's review each truck's verified status, appointments, open risks, documents, action owner, and next update.","alternatives":["I'll give you the truck picture and unresolved actions, with owners and deadlines, before I leave."],"coaching":"A handover must tell the next person what to do, not simply what happened.","goals":[["truck"],["status"],["risk","action"],["owner"],["update","deadline"]],"facts":[],"term":"Handover: transferring responsibility and current information.","difficulty":1,"chunks":["Let's review each truck's verified status, appointments, open risks, documents, action owner, and next update."],"easyAnswer":"Let's review each truck's checked status, appointments, open risks, documents, action owner, and next update.","easyQuestion":""},{"id":"bilal-002","role":"bilal","category":"Team handover","title":"Claim the next action","context":"A missing pickup number has not yet been assigned to anyone.","question":"Who's chasing the pickup number?","answer":"I'll contact the broker for the verified reference and update the load record. Please take over only after I explicitly hand it to you.","alternatives":["I own the broker follow-up for the pickup reference; I'll record the result or hand it over clearly."],"coaching":"One explicit owner prevents duplicate requests and missed tasks.","goals":[["I"],["broker"],["reference","number"],["record","update"]],"facts":[],"term":"Ownership: clear responsibility for completing a task.","difficulty":1,"chunks":["I'll contact the broker for the verified reference and update the load record.","Please take over only after I explicitly hand it to you."],"easyAnswer":"I'll contact the broker for the checked reference and update the load record. Please take over only after I explicitly hand it to you.","easyQuestion":""},{"id":"bilal-003","role":"bilal","category":"Team handover","title":"Confirm understanding","context":"You have explained the new appointment but need Bilal's read-back.","question":"Okay, I think I understand the change.","answer":"Please read back the appointment date, time zone, and next action, so we can catch any misunderstanding.","alternatives":["Tell me the new schedule and what you'll do next, including the facility time zone."],"coaching":"A read-back checks the actual information rather than accepting a vague acknowledgment.","goals":[["read back","tell me"],["schedule","appointment"],["zone"],["next"]],"facts":[],"term":"Read-back check: verifying the content another person heard.","difficulty":1,"chunks":["Please read back the appointment date, time zone, and next action, so we can catch any misunderstanding."],"easyAnswer":"Please read back the appointment date, time zone, and what we do next, so we can catch any misunderstanding.","easyQuestion":""},{"id":"bilal-004","role":"bilal","category":"Team handover","title":"Unknown current location","context":"The last driver update is old; Bilal asks for a live city.","question":"Where is P-102 right now?","answer":"I don't have a verified current location. The last update is old; I'll request a fresh check call and update the record.","alternatives":["Our last position is stale. Let me confirm with the driver before treating it as live."],"coaching":"State the age and limit of the evidence instead of guessing a city.","goals":[["old","stale"],["confirm","verified"],["location","position"],["driver","check call"]],"facts":[],"term":"Data freshness: how recently information was verified.","difficulty":1,"chunks":["I don't have a verified current location.","The last update is old; I'll request a fresh check call and update the record."],"easyAnswer":"I don't have a checked current location. The last update is old. I'll request a fresh check call and write the new number in our notes.","easyQuestion":""},{"id":"bilal-005","role":"bilal","category":"Team handover","title":"Avoid duplicate broker calls","context":"Both Kari and Riaz may call the broker about the same issue.","question":"Should I call the broker too?","answer":"I'll handle this call and record the result. Please hold off unless I hand the action to you or ask for support.","alternatives":["One of us should own the follow-up; I'm calling now, and I'll update you so we don't duplicate it."],"coaching":"Coordinate responsibilities while keeping a clear escalation path.","goals":[["handle","own"],["call"],["record","update"],["hold","duplicate"]],"facts":[],"term":"Duplicate follow-up: two people repeating the same action without coordination.","difficulty":1,"chunks":["I'll handle this call and record the result.","Please hold off unless I hand the action to you or ask for support."],"easyAnswer":"I'll handle this call and record the result. Please hold off unless I hand the action to you or ask for support.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-006","role":"bilal","category":"Team handover","title":"Mark tentative timing","context":"A driver thinks he may be empty soon, but there is no release confirmation.","question":"I'll put him down as empty now, okay?","answer":"Please mark the time as estimated, not confirmed empty. Wait for the driver's actual release before changing availability.","alternatives":["Keep it as expected availability until we verify unloading and release."],"coaching":"A predicted event must not become a completed status during handover.","goals":[["estimated","expected"],["confirmed","verify"],["release"],["availability","empty"]],"facts":[],"term":"Tentative: provisional and subject to confirmation.","difficulty":1,"chunks":["Please mark the time as estimated, not confirmed empty.","Wait for the driver's actual release before changing availability."],"easyAnswer":"Please mark the time as estimated, not confirmed empty. Wait for the driver's actual release before changing availability.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-007","role":"bilal","category":"Team handover","title":"Keep the source document","context":"Bilal wants to replace an incorrect rate confirmation with the amendment.","question":"Should I delete the original wrong confirmation?","answer":"Keep the original and the amended version with a clear current-version label. We need the change history and the agreed final terms.","alternatives":["Archive the earlier document and mark the corrected one as current so the revision stays traceable."],"coaching":"Preserve version history while making the authoritative current terms clear.","goals":[["original","earlier"],["amended","corrected"],["current"],["history","traceable"]],"facts":[],"term":"Version history: a record of changes to a document over time.","difficulty":1,"chunks":["Keep the original and the amended version with a clear current-version label.","We need the change history and the agreed final terms."],"easyAnswer":"Keep the original and the amended "difficulty":1,"chunks":["Use the agreed update time or notify earlier if the appointment risk changes.","Record the time and what you're waiting to verify."],"easyAnswer":"Use the agreed update time or tell earlier if the appointment risk changes. Record the time and what you're waiting to check.","easyQuestion":""},{"id":"bilal-010","role":"bilal","category":"Team handover","title":"Escalate a decision","context":"A broker offers a change outside the team's approval limit.","question":"Can I just accept this to save time?","answer":"It exceeds our approval limit. Gather the revised terms and ask Bashir for the decision before committing the truck.","alternatives":["Get the full change in writing and escalate to Bashir; we don't have authority to accept it ourselves."],"coaching":"A precise escalation includes the proposed change and the requested decision.","goals":[["limit","authority"],["Bashir"],["terms","change"],["before"]],"facts":[],"term":"Escalation: passing an issue to the person with the necessary authority.","difficulty":1,"chunks":["It exceeds our approval limit.","Gather the revised terms and ask Bashir for the decision before committing the truck."],"easyAnswer":"It exceeds our approval limit. Gather the updated terms and ask Bashir for the decision before promising the truck.","easyQuestion":""},{"id":"bilal-011","role":"bilal","category":"Coaching","title":"Ask one clear question","context":"Bilal asks five unrelated questions in a single fast sentence.","question":"How can I make this call easier to follow?","answer":"Ask one clear question, pause for the answer, then read back important facts before moving on.","alternatives":["Use short questions with a listening pause and confirm the key details one at a time."],"coaching":"Professional pace includes space for the other person to answer.","goals":[["one","short"],["pause","listening"],["confirm","read back"]],"facts":[],"term":"Pacing: the speed and rhythm of a conversation.","difficulty":1,"chunks":["Ask one clear question, pause for the answer, then read back important facts before moving on."],"easyAnswer":"Ask one clear question, pause for the answer, then read back important facts before moving on.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-012","role":"bilal","category":"Coaching","title":"Use a natural clarification","context":"Bilal did not hear the rate but feels embarrassed asking again.","question":"What can I say instead of guessing the rate?","answer":"Say, could you repeat the all-in rate, please? Then read the amount back to confirm it.","alternatives":["Try, I missed that figure. What is the total rate? Let me repeat it to make sure."],"coaching":"A polite clarification is professional and prevents expensive misunderstandings.","goals":[["repeat","missed"],["rate","figure"],["confirm","make sure"]],"facts":[],"term":"Clarification: asking for information to be made clearer.","difficulty":1,"chunks":["Say, could you repeat the all-in rate, please?","Then read the amount back to confirm it."],"easyAnswer":"Say, could you repeat the all-in rate, please? Then read the amount back to check it.","easyQuestion":""},{"id":"bilal-013","role":"bilal","category":"Coaching","title":"Avoid speaking over the broker","context":"Bilal talks while the broker is giving appointment instructions.","question":"Should I keep explaining while he's talking?","answer":"Let him finish, then ask your question and read back the appointment. If you miss something, ask him to repeat it.","alternatives":["Pause and listen first; respond once he's finished and confirm the timing."],"coaching":"Listening is part of telephone competence, not empty time.","goals":[["finish","listen"],["question","respond"],["appointment","timing","confirm"]],"facts":[],"term":"Interruption: speaking before another person has finished.","difficulty":2,"chunks":["Let him finish, then ask your question and read back the appointment.","If you miss something, ask him to repeat it."],"easyAnswer":"Let him finish, then ask your question and read back the appointment. If you miss something, ask him to repeat it.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-014","role":"bilal","category":"Coaching","title":"Replace an abrupt refusal","context":"Bilal says no way when a rate does not work.","question":"How do I turn that down professionally?","answer":"Say, thank you for the offer, but this rate doesn't work with our trip requirements. Please keep us in mind for another load.","alternatives":["Try, I appreciate it, but we need to pass on these terms. I'd be glad to review another option."],"coaching":"Decline the terms clearly while respecting the person.","goals":[["thank","appreciate"],["rate","terms"],["pass","doesn't work"],["another"]],"facts":[],"term":"Professional refusal: a clear, respectful decision not to accept.","difficulty":2,"chunks":["Say, thank you for the offer, but this rate doesn't work with our trip requirements.","Please keep us in mind for another load."],"easyAnswer":"Say, thank you for the offer, but this rate doesn't work with our trip requirements. Please keep us in mind for another load.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-015","role":"bilal","category":"Coaching","title":"Sound confident with uncertainty","context":"Bilal believes he must give an answer even when facts are missing.","question":"What if I don't know the driver's exact ETA?","answer":"Say what is confirmed, explain what you're checking, and give a realistic next update. Don't invent an arrival time.","alternatives":["Use, I don't have a verified ETA yet. I'll confirm with the driver and update you after that check."],"coaching":"Confidence means accurate communication, including honest limits.","goals":[["confirmed","verified"],["check","driver"],["update"],["don't invent","not"]],"facts":[],"term":"Supported ETA: an arrival estimate based on verified operating information.","difficulty":2,"chunks":["Say what is confirmed, explain what you're checking, and give a realistic next update.","Don't invent an arrival time."],"easyAnswer":"Say what is confirmed, explain what you're checking, and give a realistic next update. Don't invent an arrival time.","easyQuestion":"What if I don't know the driver's exact arrival time?","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-016","role":"bilal","category":"Coaching","title":"Separate practice scores","context":"The app shows transcript wording coverage and operational checks.","question":"Does this score measure my exact pronunciation?","answer":"No. It reflects the recognized transcript and rule-based information checks. It cannot measure exact pronunciation or certify call readiness.","alternatives":["The browser text helps us review wording and facts, but it isn't a precise accent or pronunciation assessment."],"coaching":"Keep the scope of automated assessment honest and use teacher listening for voice quality.","goals":[["transcript","text"],["pronunciation"],["cannot","isn't","not"]],"facts":[],"term":"Transcript coverage: how much required wording the recognized text contains.","difficulty":2,"chunks":["No.","It reflects the recognized transcript and rule-based information checks.","It cannot measure exact pronunciation or certify call readiness."],"easyAnswer":"No. It reflects the recognized transcript and rule-based information checks. It can't measure exact pronunciation or certify call readiness.","easyQuestion":""},{"id":"bilal-017","role":"bilal","category":"Coaching","title":"Correct a number calmly","context":"Bilal said $2,300 while the agreed amount was $2,500.","question":"I said the wrong rate. How do I correct it?","answer":"Say, let me correct that: the agreed all-in rate is $2,500. Please confirm the revised written amount matches.","alternatives":["Use, I misspoke. We agreed $2,500 all-in. I'll check that figure on the confirmation."],"coaching":"A clear correction must replace the wrong figure, not leave both as possible rates.","goals":[["correct","misspoke"],["agreed"],["all in"],["written","confirmation"]],"facts":["2500"],"term":"Misspoke: said something different from what was intended.","difficulty":2,"chunks":["Say, let me correct that: the agreed all-in rate is $2,500.","Please confirm the revised written amount matches."],"easyAnswer":"Say, let me correct that: the agreed all-in rate is $2,500. Please check the updated written amount matches.","easyQuestion":""},{"id":"bilal-018","role":"bilal","category":"Coaching","title":"Explain a chunk","context":"Bilal understands individual words but gets lost in a long answer.","question":"How should I practice the full sentence?","answer":"Practice one meaningful chunk at a time, join the chunks, then answer the question naturally without reading.","alternatives":["Start with short thought groups, build the complete answer, and finally respond from the scenario facts."],"coaching":"Chunks should preserve meaning rather than cutting sentences at random lengths.","goals":[["chunk","group"],["join","build"],["without reading","naturally","scenario"]],"facts":[],"term":"Thought group: a short phrase carrying one useful part of the meaning.","difficulty":2,"chunks":["Practice one meaningful chunk at a time, join the chunks, then answer the question naturally without reading."],"easyAnswer":"Practice one meaningful chunk at a time, join the chunks, then answer the question naturally without reading.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-019","role":"bilal","category":"Coaching","title":"Encourage an honest retry","context":"Riaz missed a key appointment fact but delivered most of the sentence.","question":"How should I coach Riaz after that attempt?","answer":"Acknowledge what he did well, identify the missing appointment detail, model it clearly, and let him try again.","alternatives":["Say, good effort; let's add the time zone. Listen to the corrected detail, then try it once more."],"coaching":"Praise effort and improvement while still correcting the important fact.","goals":[["well","good"],["missing","detail","zone"],["model","listen"],["again","retry"]],"facts":[],"term":"Coaching: specific support that helps a learner improve the next attempt.","difficulty":2,"chunks":["Acknowledge what he did well, identify the missing appointment detail, model it clearly, and let him try again."],"easyAnswer":"Acknowledge what he did well, identify the missing appointment detail, model it clearly, and let him try again.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-020","role":"bilal","category":"Coaching","title":"Swap call roles","context":"Kari always plays dispatcher and Riaz always plays broker.","question":"Should we keep the same roles every time?","answer":"Let's swap broker and dispatcher roles so we practice both asking for details and explaining them clearly.","alternatives":["We'll exchange parts after this call and use the same load facts from the other side."],"coaching":"Role reversal builds listening and perspective as well as vocabulary.","goals":[["swap","exchange"],["broker"],["dispatcher"],["both","other"]],"facts":[],"term":"Role swap: exchanging the participants' parts in a practice conversation.","difficulty":2,"chunks":["Let's swap broker and dispatcher roles so we practice both asking for details and explaining them clearly."],"easyAnswer":"Let's swap broker and dispatcher roles so we practice both asking for details and explaining them clearly.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-021","role":"bilal","category":"Operations","title":"Check a wrong rate","context":"A teammate is about to sign a fictional $2,300 confirmation after a $2,500 agreement.","question":"Can I sign this and ask them to fix it later?","answer":"Please wait. The document shows $2,300 instead of the agreed $2,500. Request an amended confirmation before signing.","alternatives":["Don't sign the mismatch; get the rate corrected from $2,300 to $2,500 first."],"coaching":"Spotting the error only helps if the next action prevents accepting the wrong term.","goals":[["amended","correct"],["before","first"],["sign"]],"facts":["2300","2500"],"term":"Document audit: checking written terms against the agreement and brief.","difficulty":2,"chunks":["Please wait.","The document shows $2,300 instead of the agreed $2,500.","Request an amended confirmation before signing."],"easyAnswer":"Please wait. The document shows $2,300 instead of the agreed $2,500. Request an amended written confirmation before signing.","easyQuestion":""},{"id":"bilal-022","role":"bilal","category":"Operations","title":"Check rate math","context":"The fictional quote is $1,500 and total miles are 600.","question":"Is that three dollars a mile on the full trip?","answer":"No, $1,500 divided by 600 total miles is $2.50 per mile, before costs.","alternatives":["The total-mile gross RPM is $2.50, not three dollars; expenses still need to be deducted."],"coaching":"Recalculate using the stated denominator and label gross revenue.","goals":[["total"],["before costs","expense","gross"]],"facts":["2.50"],"term":"Denominator: the miles used to calculate a per-mile amount.","difficulty":2,"chunks":["No, $1,500 divided by 600 total miles is $2.50 per mile, before costs."],"easyAnswer":"No, $1,500 divided by 600 total miles is $2.50 per mile, before costs.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-023","role":"bilal","category":"Operations","title":"Check a detention calculation","context":"The scenario has 5 eligible waiting hours, 2 free hours, and $50 per billable hour.","question":"Should I request two hundred fifty dollars?","answer":"Under these terms, 5 hours minus 2 free leaves 3 billable hours. At $50 per hour, the request is $150.","alternatives":["It's $150 for 3 payable hours at $50, with the free time deducted and evidence attached."],"coaching":"Do not charge the agreed free time. The result remains a request until approved.","goals":[["hour"],["free","payable"]],"facts":["3","50","150"],"term":"Billable time: the time chargeable under the agreed terms.","difficulty":2,"chunks":["Under these terms, 5 hours minus 2 free leaves 3 billable hours.","At $50 per hour, the request is $150."],"easyAnswer":"Under these terms, 5 hours minus 2 free leaves 3 billable hours. At $50 per hour, the request is $150.","easyQuestion":"","easyNote":"This answer is already plain English. Practise it first slowly, then again in a confident professional voice."},{"id":"bilal-024","role":"bilal","category":"Operations","title":"Maintain exception evidence","context":"A broker asks for a clear arrival timeline.","question":"Should I just summarize the waiting from memory?","answer":"Use verified timestamps, messages, and facility or driver evidence. Mark anything unconfirmed instead of reconstructing it as fact.","alternatives":["Build the timeline from actual records and identify gaps explicitly."],"coaching":"A polished story cannot replace supporting evidence.","goals":[["verified","actual"],["timestamp","record"],["evidence"],["unconfirmed","gap"]],"facts":[],"term":"Evidence gap: information not supported by a verified record.","difficulty":2,"chunks":["Use verified timestamps, messages, and facility or driver evidence.","Mark anything unconfirmed instead of reconstructing it as fact."],"easyAnswer":"Use checked timestamps, messages, and facility or driver evidence. Mark anything unconfirmed instead of reconstructing it as fact.","easyQuestion":""},{"id":"bilal-025","role":"bilal","category":"Operations","title":"Flag location conflict","context":"A BOL says Atlanta while the revised email says Augusta.","question":"Which destination should I send the driver to?","answer":"Pause and verify the authorized destination through the established broker contact. Get matching written instructions before departure.","alternatives":["Don't choose by guessing; resolve the destination conflict and document the approved correction first."],"coaching":"A more recent message is not automatically an authorized change.","goals":[["verify"],["destination"],["authorized","approved"],["written","document"],["before","first"]],"facts":[],"term":"Conflicting instruction: directions that do not agree with each other.","difficulty":2,"chunks":["Pause and verify the authorized destination through the established broker contact.","Get matching written instructions before departure."],"easyAnswer":"Pause and check the authorized destination through the established broker contact. Get matching written instructions before departure.","easyQuestion":""},{"id":"bilal-026","role":"bilal","category":"Operations","title":"Prevent unapproved payment","context":"Bilal receives a new payment link for a lumper charge.","question":"Should I enter the payment details on this new link?","answer":"Verify the charge, recipient, authorization, and approved payment method through established channels before entering payment information.","alternatives":["Check the payment request with the authorized contact first, then use the agreed method and retain the receipt."],"coaching":"An urgent request and a new link do not establish approval or authenticity.","goals" isted responses.</div>'}<button class="sm ghost" data-action="weak-review">${icon('repeat')} Review current role</button></section><section class="panel panel-pad"><div class="row between"><h3>Recent practice</h3><button class="text-link" data-action="export">Backup ${icon('download')}</button></div>${p.history.length?p.history.slice(0,18).map(h=>`<div class="history-item"><span class="badge ${h.passed?'green':'gold'}">${h.passed?'✓':'↻'}</span><div class="grow"><h3>${esc(h.title)}</h3><p>${esc(h.kind)} · ${esc(h.method)}${h.assisted?' · Assisted':''}<br>${new Date(h.at).toLocaleString()}</p>${h.critical?.length?'<p class="amber">'+esc(h.critical.slice(0,2).join('. '))+'</p>':''}</div><div class="history-score">${h.operational??'—'}<small>information /100</small></div></div>`).join(''):'<div class="empty">Start a situation or take a practice call. Your recorded responses will appear here.</div>'}</section></div><section class="panel panel-pad" style="margin-top:20px"><div class="row between"><h3>Freight desk checks</h3><span class="badge">${p.desk.length} attempts</span></div>${p.desk.length?p.desk.slice(0,6).map(d=>`<div class="history-item"><div class="grow"><h3>${esc(d.loadId)} · ${esc(d.document.toUpperCase())}</h3><p>${d.passed?'All discrepancies found':'Needs another review'} · ${new Date(d.at).toLocaleString()}</p></div><span class="accent">${d.score}/100</span></div>`).join(''):'<p class="small muted">Document audits are recorded separately from speaking practice.</p>'}</section>`;}

function openLibrary(){openModal('All '+DATA.lessons.length+' speaking situations',`<div class="filter-row"><input id="library-search" type="search" placeholder="Search phrases, situations, or facts…" aria-label="Search practice situations"><select id="library-role" aria-label="Filter communication role"><option value="all">All five roles</option>${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===S.role?'selected':''}>${r.label}</option>`).join('')}</select></div><p class="muted small" id="library-count"></p><div class="library-list" id="library-list"></div>`,'library');updateLibrary();}
function updateLibrary(){const role=$('library-role')?.value||'all',q=ZCore.normalize($('library-search')?.value||'');const list=DATA.lessons.filter(l=>(role==='all'||l.role===role)&&ZCore.normalize(l.title+' '+l.question+' '+l.context+' '+l.category).includes(q));if($('library-count'))$('library-count').textContent=list.length+' situations · select any starting point';if($('library-list'))$('library-list').innerHTML=list.map((l,i)=>`<div class="library-row"><span class="index">${String(i+1).padStart(2,'0')}</span><div class="grow"><h3>${esc(l.title)}</h3><p>${esc(ROLES[l.role].label)} · ${esc(l.category)} · ${['','Foundation','Working practice','Decision practice'][l.difficulty]}</p><p>${esc(l.question)}</p></div><button class="sm ghost" data-action="choose-lesson" data-value="${l.id}">Practise ${icon('arrow')}</button></div>`).join('')||'<div class="empty">No situations match. Try a shorter phrase.</div>';}
function openSettings(){Voice.refresh();const voices=Voice.voices.filter(v=>/^en/i.test(v.lang));const level=Number(store.settings.level||1);openModal('Practice & audio settings',`<div class="section-label">Voice coaching</div><div class="field"><label for="setting-mode">Practice flow</label><select id="setting-mode"><option value="auto" ${store.settings.mode==='auto'?'selected':''}>Fully automatic · recommended</option><option value="manual" ${store.settings.mode==='manual'?'selected':''}>Manual controls</option></select></div><div class="field"><label for="setting-level">Learning level</label><select id="setting-level"><option value="1" ${level===1?'selected':''}>Beginner · question once, answer visible</option><option value="2" ${level===2?'selected':''}>Supported · full answer visible</option><option value="3" ${level===3?'selected':''}>Independent · extra recall step</option></select></div><div class="field"><label for="setting-voice">American English browser voice</label><select id="setting-voice"><option value="">Automatic · American English preferred</option>${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===store.settings.voice?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}</select></div><div class="grid-2"><div class="field"><label for="setting-rate">Voice pace</label><select id="setting-rate">${[[.8,'Slow · 0.80x'],[.94,'Comfortable · 0.94x'],[1,'Natural · 1.00x'],[1.08,'Fast · 1.08x']].map(([v,txt])=>`<option value="${v}" ${Number(store.settings.rate)===v?'selected':''}>${txt}</option>`).join('')}</select></div><div class="field"><label for="setting-patience">Speaking pause</label><select id="setting-patience">${[[2400,'2.4 seconds'],[3500,'3.5 seconds'],[5000,'5 seconds']].map(([v,txt])=>`<option value="${v}" ${Number(store.settings.patience)===v?'selected':''}>${txt}</option>`).join('')}</select></div></div><label class="row"><input type="checkbox" id="setting-tts" ${store.settings.tts?'checked':''}> Voice playback enabled</label><label class="row" style="margin-top:13px"><input type="checkbox" id="setting-pashto" ${store.settings.pashto?'checked':''}> Show available Pashto definitions (text only)</label><p class="footnote">The app speaks English. Microphone is the normal input in Auto Mode. Typing is offered only as a recovery option if speech recognition is unavailable.</p><div class="row wrap" style="margin-top:14px"><button class="sm" data-action="test-voice">${icon('volume')} Test voice</button><button class="sm ghost" data-action="help">Microphone help</button></div><div class="section-label">WhatsApp class reports</div><div class="field"><label for="setting-report-phone">Your teacher’s WhatsApp number</label><input id="setting-report-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Country code and phone number, for example +93…" value="${esc(store.settings.reportPhone||'')}"><small>Enter your number in international format. Nothing is sent automatically. Each student must enter the teacher number once on their own device; it is not transmitted by sharing the website link. They tap Send report and confirm in WhatsApp.</small></div><div class="section-label">Your saved progress</div><div class="row wrap"><button class="sm" data-action="export">Export backup</button><button class="sm" data-action="import-backup">Import backup</button><button class="sm danger" data-action="reset-profile">Reset ${esc(store.profile)}</button></div><input type="file" id="backup-file" accept="application/json,.json" class="hidden"><div class="modal-footer"><button data-action="close-modal">Close</button><button class="primary" data-action="save-settings">Save settings ${icon('check')}</button></div>`,'settings');}

function openHelp(){openModal('How your automatic coach works',`<div class="help-content"><h3>Start once · the screen takes you forward</h3><p>Choose Broker, Dispatcher, Driver, Bashir or Bilal from the bottom. Select Auto (default), then Start. The app speaks and centers the active line. When it is your turn the highlighted answer and microphone appear together; the recognized words appear just below.</p><h3>Beginner: no unnecessary repeating</h3><p>The app speaks the question once, teaches the model answer, listens to your answer once, gives short feedback and continues. A second attempt is reserved for silence or important errors. Independent level adds a separate recall step.</p><h3>Phone calls</h3><p>Take the simulated ringing call. The full spoken answer is visible for beginners. Read the highlighted response, verify every critical number and advance with coaching. All calls and documents use mock data.</p><h3>Microphone and offline limits</h3><p>Chrome and other browsers may need HTTPS, explicit microphone permission and internet access for speech recognition. A downloaded file opened using content:// can be restricted. Use a hosted HTTPS page or PWA for best recognition support. If it cannot hear you, the app pauses and tells you the issue; typing is an optional recovery only, not a voice score. Do not use the app's own voice as evidence of microphone success.</p><h3>Training only</h3><p>This program uses fictional and reconstructed scenarios inspired by supplied records, some of which retain real historical names. The speaking lines are not original recordings. It is not a DAT account, live dispatch system, or proof of verified carrier operation. Browser recognition is not a pronunciation/accent assessment.</p></div>`,'help');}

function openGlossary(){const terms=[...new Set(DATA.lessons.map(l=>l.term).filter(t=>!t.startsWith('D20 source:')))];openModal('The language of the call',`<input id="glossary-search" type="search" placeholder="Search a term…" aria-label="Search trucking terms"><div class="glossary-list" id="glossary-list" style="margin-top:18px">${terms.sort().map(t=>{const idx=t.indexOf(':');return `<article class="glossary-item" data-glossary="${esc(t.toLowerCase())}"><div class="row"><div class="grow"><b>${esc(idx>=0?t.slice(0,idx):'Training note')}</b><p>${esc(idx>=0?t.slice(idx+1):t)}</p></div><button class="icon-btn sm quiet" data-action="speak-text" data-value="${esc(t)}" aria-label="Hear ${esc(t.slice(0,idx))}">${icon('volume')}</button></div></article>`;}).join('')}</div>`,'glossary');}
function showLoadBrief(id){const l=DATA.loads.find(x=>x.id===id)||selectedLoad();openModal(l.id+' · fictional load brief',`${briefHTML(l)}<div class="section-label">Operating details</div><p class="small">${esc(l.requirements)}</p><p class="small muted">${esc(l.terms)}</p><p class="small">Pickup reference: <strong>${esc(l.reference)}</strong><br>Truck: ${esc(l.truck)} · Driver: ${esc(l.driver)}</p><div class="notice blue">Each speaking situation and full-call brief can override this reference listing. Use the facts stated in your current exercise.</div>`,'brief');}
function chooseLesson(id){const l=DATA.lessons.find(x=>x.id===id);if(!l)return;checkpoint();cancelIO();closeModal();S.role=l.role;store.role=l.role;S.view='wizard';S.session=null;S.call=null;S.selected=l.id;S.done=null;S.started=false;S.paused=false;resetAttempt();setPhase('idle');save();render();}
function exportBackup(){const blob=new Blob([JSON.stringify({format:'zirak-dispatch-backup',version:1,exportedAt:new Date().toISOString(),data:store},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Zirak-Dispatch-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup download prepared. Keep the JSON file for another device.');}
function confirmReset(){openModal('Reset '+store.profile+'’s saved progress?',`<p class="small muted">This clears this learner's history, weak answers, and saved checkpoint on this browser. Export a backup first if you want to keep it.</p><div class="modal-footer"><button data-action="settings">Cancel</button><button data-action="export">Export backup</button><button class="danger" data-action="confirm-reset">Reset progress</button></div>`,'reset');}
function applySettings(){const cfg=store.settings;cfg.mode=$('setting-mode').value;cfg.level=Number($('setting-level').value);cfg.input='speech';cfg.voice=$('setting-voice').value;cfg.rate=Number($('setting-rate').value);cfg.patience=Number($('setting-patience').value);cfg.tts=$('setting-tts').checked;cfg.pashto=$('setting-pashto').checked;cfg.reportPhone=($('setting-report-phone')?.value||'').trim();S.showType=false;cancelIO();if(S.session||S.call?.active){S.paused=true;setPhase('paused');}save();closeModal();render();toast('Settings saved. Your voice coach is ready.');}

function prepareTyping(){cancelIO();store.settings.input='typing';S.showType=true;S.paused=false;S.error=null;if(!S.session&&!S.call?.active&&S.view==='wizard'){const list=DATA.lessons.filter(x=>x.role===S.role),idx=Math.max(0,list.findIndex(x=>x.id===S.selected)),n=Number(store.settings.sessionSize)||list.length;S.session={ids:list.slice(idx,idx+n).map(x=>x.id),index:0,stage:1,part:0,variant:'easy',retry:0,results:[],easyResults:[],scored:false,assessment:false,startedAt:new Date().toISOString()};S.started=true;}if(S.session)S.session.scored=false;if(S.call)S.call.scored=false;save();setPhase('ready');checkpoint();render();$('typed-answer')?.focus();}
async function manualHear(){if(S.view==='calls'&&S.call?.active){S.call.scored=false;return runCallTurn(true);}if(!S.session){const list=DATA.lessons.filter(x=>x.role===S.role),idx=list.findIndex(x=>x.id===S.selected);return makeSession(list.slice(idx,idx+(Number(store.settings.sessionSize)||list.length)).map(x=>x.id));}return runWizard();}
async function handleAction(action,value){
 if(action==='close-modal'){closeModal();return;}
 if(action==='read-guide'){speakPracticeGuide();return;}
 if(action==='read-summary'){playFinalReview(S.done||S.callResults);return;}
 if(action==='share-whatsapp'){reportToWhatsApp(S.done||S.callResults||{title:'Practice',results:[],total:0});return;}
 if(action==='retry-answer'){cancelIO();S.error=null;S.feedback=null;S.paused=false;S.live='';if(S.call?.active){S.call.scored=false;S.call.retry=1;runCallTurn(true);}else if(S.session){S.session.scored=false;S.session.retry=1;runWizard();}return;}
 if(action==='view'){switchView(value);return;}
 if(action==='role'){switchRole(value);return;}
 if(action==='swap-role'){switchRole(S.role==='broker'?'dispatcher':'broker');return;}
 if(action==='settings'){if(S.started)pause();openSettings();return;}
 if(action==='help'){if(S.started)pause();openHelp();return;}
 if(action==='library'){if(S.started)pause();openLibrary();return;}
 if(action==='glossary'){if(S.started)pause();openGlossary();return;}
 if(action==='choose-lesson'){chooseLesson(value);return;}
 if(action==='load-brief'){showLoadBrief(value);return;}
 if(action==='desk-popover'){showLoadBrief(currentCall()?.loadId);return;}
 if(action==='resume-saved'){resumeCheckpoint();return;}
 if(action==='primary'){
  if(!S.started&&!S.session&&!S.call?.active){startPractice();return;}
  if(S.paused){resume();return;}
  if(store.settings.mode==='auto'){pause();return;}
  if(S.phase==='listening'){Mic.stop();return;}
  const scored=S.session?.scored||S.call?.scored;
  if(scored){if(S.call?.active)advanceCall();else advanceWizard();return;}
  if(store.settings.input==='typing'){prepareTyping();return;}
  if(S.call?.active)captureCall();else captureWizard();return;
 }
 if(action==='mode'){cancelIO();store.settings.mode=value;if(value==='auto'){store.settings.input='speech';S.showType=false;}save();if(S.started){S.paused=true;setPhase('paused');checkpoint();}render();return;}
 if(action==='hear'||action==='repeat-call'){manualHear();return;}
 if(action==='mic'||action==='retry-mic'){
  S.error=null;S.showType=false;store.settings.input='speech';S.paused=false;save();
  if(S.call?.active)captureCall();else if(S.session)captureWizard();else if(S.view==='two')twoCapture();else startPractice();return;
 }
 if(action==='typing'){prepareTyping();return;}
 if(action==='text-audio'){store.settings.tts=false;S.error=null;S.paused=false;save();if(S.call?.active)runCallTurn(true);else runWizard();return;}
 if(action==='submit-type'){
  const text=$('typed-answer')?.value.trim();if(!text){toast('Write a response first.');return;}const t=cancelIO();store.settings.input='typing';S.showType=true;S.paused=false;S.error=null;save();if(S.session){S.session.scored=false;await gradeWizard(text,'typed',t);}else if(S.call?.active){S.call.scored=false;await gradeCall(text,'typed',t);}return;
 }
 if(action==='next-step'){if(S.call?.active)advanceCall();else advanceWizard(true);return;}
 if(action==='back-step'){backWizard();return;}
 if(action==='end-session'){pause();openModal('End this practice session?',`<p class="small muted">Completed responses stay saved. Unattempted situations will remain unassessed.</p><div class="modal-footer"><button data-action="close-modal">Keep paused</button><button class="primary" data-action="confirm-end">End session</button></div>`,'end');return;}
 if(action==='confirm-end'){closeModal();if(S.session){S.session.ids=S.session.ids.slice(0,S.session.results.length);completeWizard();}return;}
 if(action==='reveal'){S.reveal=!S.reveal;if(S.reveal)S.assisted=true;render();return;}
 if(action==='hear-alternative'||action==='hear-term'||action==='speak-text'){
  if(S.started)pause();const t=cancelIO();const text=action==='speak-text'?value:action==='hear-term'?currentLesson().term:currentLesson().alternatives[0];if(action==='hear-alternative'){S.assisted=true;S.reveal=true;}try{await Voice.say(text,t);setPhase(S.started?'paused':'idle');}catch(e){handleIssue(e,'wizard');}return;
 }
 if(action==='assessment'){startAssessment();return;}
 if(action==='weak-review'){S.done=null;weakReview();return;}
 if(action==='new-session'){if(S.callResults&&S.call){beginCall(S.call.id);return;}if(S.done?.ids?.length){makeSession(S.done.ids,S.done.kind==='assessment');return;}S.done=null;S.session=null;S.started=false;resetAttempt();setPhase('idle');render();return;}
 if(action==='start-mission'){beginMission();return;}
 if(action==='mission-next'){nextMission();return;}
 if(action==='start-call'){beginCall(value);return;}
 if(action==='answer-call'){answerCall();return;}
 if(action==='decline-call'||action==='call-list'){if(action==='call-list')S.mission=null;cancelIO();clearInterval(callClock);S.call=null;S.callResults=null;S.started=false;S.view='calls';resetAttempt();render();return;}
 if(action==='hangup'){finishCall(true);return;}
 if(action==='call-hint'){callHint();return;}
 if(action==='select-load'){S.loadId=value;S.amended=false;S.flags=[];S.docResult=null;render();return;}
 if(action==='doc-type'){S.docType=value;S.amended=false;S.flags=[];S.docResult=null;render();return;}
 if(action==='flag-field'){S.flags=S.flags.includes(value)?S.flags.filter(x=>x!==value):[...S.flags,value];S.docResult=null;render();return;}
 if(action==='check-doc'){checkDocument();return;}
 if(action==='amend-doc'){if(S.docResult?.passed){S.amended=true;S.flags=[];render();toast('Verified correction is now shown. Keep the original and amendment traceable.');}return;}
 if(action==='truck-decision'){const checks=[...document.querySelectorAll('[data-truck-check]')];const all=checks.length===3&&checks.every(x=>x.checked);$('truck-result').textContent=all?'All three practice checks are confirmed. Evaluate the specific load and agreement before booking.':'Hold the offer: empty release, driver feasibility, and equipment readiness all need verification.';return;}
 if(action==='start-two'){createTwo($('two-call')?.value);return;}
 if(action==='two-list'){cancelIO();S.two=null;render();return;}
 if(action==='swap-two'){if(S.two){cancelIO();S.two={...S.two,index:0,swapped:!S.two.swapped,reveal:false,marks:[],done:false,heard:'',score:null};S.error=null;setPhase('idle');render();}return;}
 if(action==='two-reveal'){S.two.reveal=!S.two.reveal;render();return;}
 if(action==='two-hear'){const p=twoPeople(),turn=p.call.turns[Math.floor(S.two.index/2)];if(S.two.index%2)S.two.reveal=true;const t=cancelIO();render();try{await Voice.say(S.two.index%2?turn.answer:turn.prompt,t);setPhase('idle');}catch(e){handleIssue(e,'two');}return;}
 if(action==='two-mic'){twoCapture();return;}
 if(action==='two-mark'){twoNext(value);return;}
 if(action==='two-back'){cancelIO();S.two.index=Math.max(0,S.two.index-1);S.two.reveal=false;S.two.heard='';S.two.score=null;render();return;}
 if(action==='export'){exportBackup();return;}
 if(action==='import-backup'){$('backup-file')?.click();return;}
 if(action==='reset-profile'){confirmReset();return;}
 if(action==='confirm-reset'){cancelIO();store.profiles[store.profile]=freshProfile();S.session=null;S.call=null;S.done=null;S.started=false;S.paused=false;save();closeModal();render();toast('This learner’s progress was reset.');return;}
 if(action==='save-settings'){applySettings();return;}
 if(action==='test-voice'){const t=cancelIO();const old=store.settings.voice,rate=store.settings.rate;store.settings.voice=$('setting-voice')?.value||'';store.settings.rate=Number($('setting-rate')?.value||rate);try{await Voice.say('Good morning. This is Pamir dispatch. Could you confirm the pickup appointment, please?',t);setPhase(S.started?'paused':'idle');}catch(e){toast(e.message);}finally{store.settings.voice=old;store.settings.rate=rate;}return;}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();handleAction(b.dataset.action,b.dataset.value).catch(err=>handleIssue(err,'interface'));});
document.addEventListener('input',e=>{
 if(e.target.id==='typed-answer')S.typed=e.target.value;
 if(e.target.id==='library-search')updateLibrary();
 if(e.target.id==='glossary-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-glossary]').forEach(x=>x.hidden=!x.dataset.glossary.includes(q));}
 if(e.target.id.startsWith('calc-'))calcUpdate();
});
document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.id==='profile-select'){checkpoint();cancelIO();store.profile=el.value;S.session=null;S.call=null;S.callResults=null;S.done=null;S.started=false;S.paused=false;resetAttempt();setPhase('idle');save();render();}
 if(el.id==='coach-level'){cancelIO();store.settings.level=Number(el.value);store.settings.input='speech';S.showType=false;if(S.session){S.paused=true;setPhase('paused');}save();render();}
 if(el.id==='session-size'){store.settings.sessionSize=Number(el.value);save();}
 if(el.id==='library-role')updateLibrary();
 if(el.id==='call-support'){store.settings.callSupport=el.value;save();render();}
 if(el.id==='backup-file'&&el.files[0]){
  try{const file=el.files[0];if(file.size>12*1024*1024)throw new Error('Backup is too large.');const parsed=JSON.parse(await file.text());const data=parsed.data;
   if(parsed.format!=='zirak-dispatch-backup'||parsed.version!==1||!data||data.version!==1||!data.profiles?.Kari||!data.profiles?.Riaz)throw new Error('Not a supported ZIRAK Dispatch backup.');
   for(const name of ['Kari','Riaz']){if(!Array.isArray(data.profiles[name].history)||!data.profiles[name].weak||typeof data.profiles[name].weak!=='object')throw new Error('The backup has invalid learner data.');}
   window.__pendingDispatchBackup=data;openModal('Restore this backup?',`<p class="small muted">This replaces Kari and Riaz's current local practice histories and settings with the selected backup. Export the current data first if needed.</p><div class="modal-footer"><button data-action="settings">Cancel</button><button data-action="export">Export current</button><button class="primary" id="confirm-import">Restore backup</button></div>`,'import');
  }catch(err){toast(err.message);}
 }
});
document.addEventListener('click',e=>{if(e.target.closest('#confirm-import')){cancelIO();const data=window.__pendingDispatchBackup;store={version:1,settings:{...DEFAULT.settings,...data.settings},profile:['Kari','Riaz'].includes(data.profile)?data.profile:'Kari',role:ROLES[data.role]?data.role:'broker',profiles:{}};for(const name of ['Kari','Riaz'])store.profiles[name]={...freshProfile(),...data.profiles[name]};delete window.__pendingDispatchBackup;S.session=null;S.call=null;S.done=null;S.role=store.role;S.selected=DATA.lessons.find(l=>l.role===S.role).id;S.started=false;S.paused=false;save();closeModal();render();toast('Backup restored. Saved sessions are ready to resume.');}});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'&&e.target.id==='typed-answer'){e.preventDefault();handleAction('submit-type').catch(err=>handleIssue(err,'typed'));}if(e.key===' '&&!/input|textarea|select|button/i.test(e.target.tagName)&&!$('modal').open&&S.started){e.preventDefault();S.paused?resume():pause();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(S.started||S.call?.ringing)){if(S.call?.ringing){Ring.stop();S.call.ringing=false;S.call.missed=true;}else pause();}});
window.addEventListener('pagehide',()=>{checkpoint();cancelIO();});
// Expose read-only content and explicit UI actions for local verification and source reuse.
window.ZDW={build:'3.1.0-prehost-qa',data:DATA,core:ZCore,getState:()=>structuredClone(S),getSaved:()=>structuredClone(store),action:handleAction,configure:settings=>{store.settings={...store.settings,...settings};save();render();},pause,selectLesson:chooseLesson};
render();if(storageFailed)setTimeout(()=>toast('Browser storage is unavailable. Export a backup to keep practice results.'),500);
if(document.querySelector('link[rel=manifest]')&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
